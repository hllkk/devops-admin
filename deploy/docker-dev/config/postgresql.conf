# ============================================================================
# Dev 环境 PostgreSQL 主配置
#
# 挂载方式：docker-compose 把本文件映射到 /etc/postgresql/postgresql.conf
# 启动命令：postgres -c config_file=/etc/postgresql/postgresql.conf
#
# 修改后重载（数据不丢）：
#   docker compose -f deploy/docker-dev/docker-compose.yml restart pgsql
#
# 说明：这里只保留 dev 常用项；未列出的参数沿用编译默认值。
#       不要在此设置 data_directory / hba_file —— 沿用镜像默认（PGDATA=/var/lib/postgresql/data）。
# ============================================================================

# ---------- 连接 ----------
listen_addresses = '*'            # 容器内监听所有网卡，端口映射由 docker 控制
port = 5432
max_connections = 100             # dev 足够
superuser_reserved_connections = 3

# ---------- 内存 / 资源 ----------
shared_buffers = 128MB            # PG 自管缓存，建议为容器内存的 1/4
effective_cache_size = 512MB      # 操作系统磁盘缓存估计值
work_mem = 4MB                    # 单次排序/哈希的内存
maintenance_work_mem = 64MB       # VACUUM / CREATE INDEX 的内存

# ---------- 时区 / 区域 ----------
timezone = 'Asia/Shanghai'
log_timezone = 'Asia/Shanghai'
# client_encoding 默认 UTF8（initdb 已用 --encoding=UTF8）

# ---------- 日志（走 stdout，docker logs 可见）----------
logging_collector = off           # 不写本地文件，交给 docker 日志驱动
log_destination = 'stderr'
log_min_messages = info
log_statement = 'none'            # 排查问题时可改为 'all' 记录全部 SQL
log_duration = off
log_line_prefix = '%m [%p] %u@%d '

# ---------- 自动清理 ----------
autovacuum = on
