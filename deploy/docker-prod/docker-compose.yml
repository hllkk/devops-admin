# ============================================================================
# devops-admin 生产环境全栈编排：nginx(前端) + server(后端) + PostgreSQL + Redis + RustFS
#
# 用法（详见 README.md）：
#   1) cp .env.example .env               # 填入强随机机密（JWT/INIT_ADMIN/PG/Redis/RustFS 密码）
#   2) docker compose up -d --build
#   注：config/config.yaml 为静态入库配置（密码由 env 覆盖），无需编辑
#
# 安全要点：
#   - DB / Redis / RustFS 端口默认不对宿主暴露，仅在 prod-net 内以服务名互访
#   - 仅 web(80) 对外；后端默认只经 web 反代访问（SERVER_PORT 见 .env，生产建议注释）
#   - 机密只走 .env（initialize/other.go 用 env 覆盖 config.yaml），config.yaml 静态入库
# ============================================================================

name: devops-admin-prod

services:
  # ----------------------------------------------------------------------------
  # 前端 + 反向代理
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ../../web
      # Dockerfile 统一放在 docker-prod/，经 BuildKit 引用 context 之外的 Dockerfile
      dockerfile: ../deploy/docker-prod/Dockerfile.web
    # 版本化 tag：与 server ldflags 注入共用 APP_VERSION（deploy/release/build-release.sh 发布时注入），
    # 在线升级/回滚依赖版本 tag（旧版本镜像不被升级覆盖，保留本地可随时回退）
    image: devops-admin/web:${APP_VERSION:-prod}
    container_name: devops-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      # nginx 主配置：SPA 托管 + /proxy-default 反代到 server
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      server:
        condition: service_started
    networks:
      - prod-net

  # ----------------------------------------------------------------------------
  # 后端
  # ----------------------------------------------------------------------------
  server:
    build:
      context: ../../server
      # Dockerfile 统一放在 docker-prod/，经 BuildKit 引用 context 之外的 Dockerfile
      dockerfile: ../deploy/docker-prod/Dockerfile.server
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        APP_VERSION: ${APP_VERSION:-dev}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: devops-admin/server:${APP_VERSION:-prod}
    container_name: devops-server
    restart: unless-stopped
    environment:
      # 配置文件路径（静态挂载 :ro；DOCKER_ENV 下向导不回写，敏感项由 env 覆盖）
      OPS_CONFIG: /app/config/config.yaml
      TZ: ${TZ:-Asia/Shanghai}
      # Docker 自动初始化标识 + 生产模式
      DOCKER_ENV: "true"
      GIN_MODE: release
      # 机密：由 initialize/other.go 覆盖 config.yaml 对应字段，无需在 config 维护
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?必须设置 JWT_SIGNING_KEY}
      PG_PASSWORD: ${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?必须设置 REDIS_PASSWORD}
      RUSTFS_ROOT_USER: ${RUSTFS_ROOT_USER:-devops-admin}
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_ROOT_PASSWORD:?必须设置 RUSTFS_ROOT_PASSWORD}
      # 自动初始化超级管理员密码（首次 /init/autoInitDB 生效）；强制必填，留空则 compose 启动报错
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:?必须设置 INIT_ADMIN_PASSWORD}
      # 可信反代（多层反代下正确解析真实 ClientIP）
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12,127.0.0.1/32,::1/128}
      # AI 网关 LiteLLM 底座：master-key 敏感走 env 覆盖 config；public-url 按部署域名（经 nginx /llm/ 反代，留空则不下发）
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?必须设置 LITELLM_MASTER_KEY}
      LITELLM_PUBLIC_URL: ${LITELLM_PUBLIC_URL:-}
    volumes:
      # 静态配置（入库，只读挂载；DOCKER_ENV 下向导不回写，敏感项由 env 覆盖）
      - ./config/config.yaml:/app/config/config.yaml:ro
      # 本地上传文件（oss-type=local 时使用；minio 模式下也可留作兜底）
      - ${SERVER_UPLOADS_PATH:-/home/docker/docker-prod/uploads}:/app/uploads
      # 运行日志（zap director=log）
      - ${SERVER_LOG_PATH:-/home/docker/docker-prod/server-log}:/app/log
    # 生产：后端不对外暴露，仅经 web(:80) 反代访问（容器间走 prod-net 的 server:8888）
    # 如需宿主直连调试，取消下行注释并确保端口未被占用：
    # ports:
    #   - "${SERVER_PORT:-8888}:8888"
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
      litellm:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8888/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - prod-net

  # ----------------------------------------------------------------------------
  # PostgreSQL 18
  # ----------------------------------------------------------------------------
  pgsql:
    image: postgres:18-alpine
    container_name: devops-pgsql
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD}
      # 建业务库：server 启动直连成功，配合 /init/autoInitDB 自动建表/建管理员
      POSTGRES_DB: ${POSTGRES_DB:-devops_admin}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # PG 18+ 默认 PGDATA=/var/lib/postgresql/18/docker，卷挂父目录
      - ${PG_DATA_PATH:-/home/docker/docker-prod/pgsql}:/var/lib/postgresql
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devops} -d ${POSTGRES_DB:-devops_admin}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - prod-net

  # ----------------------------------------------------------------------------
  # Redis 8（requirepass 由启动参数从 .env 注入，conf 内不留明文密码）
  # ----------------------------------------------------------------------------
  redis:
    image: redis:8-alpine
    container_name: devops-redis
    restart: unless-stopped
    environment:
      # 仅供 healthcheck 在容器内读取
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${REDIS_DATA_PATH:-/home/docker/docker-prod/redis}:/data
      - ./config/redis.conf:/etc/redis/redis.conf:ro
    command: ["redis-server", "/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - prod-net

  # ----------------------------------------------------------------------------
  # RustFS（S3 兼容对象存储，与 dev 一致；server 侧 oss-type=minio，
  # minio-go 客户端直连 rustfs，业务代码零改动）
  # 端口默认不对外：前端文件下载经 nginx 的 /oss/ 反代访问（见 nginx.conf）
  # ----------------------------------------------------------------------------
  rustfs:
    image: rustfs/rustfs:${RUSTFS_VERSION:-latest}
    container_name: devops-rustfs
    user: root                       # 免去 bind mount 目录属主修正
    restart: unless-stopped
    environment:
      RUSTFS_ROOT_USER: ${RUSTFS_ROOT_USER:-rustfsadmin}
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_ROOT_PASSWORD}
      RUSTFS_BROWSER: "on"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${RUSTFS_DATA_PATH:-/home/docker/docker-prod/rustfs}:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - prod-net

  # 一次性：rustfs 启动后建 bucket，并将匿名下载收敛到 uploads/ 前缀
  # 头像/媒体走 uploads/（前端经 nginx /oss/ 可直接匿名 GET）；撤整桶匿名后，其余前缀
  # 默认私有，下载必须走后端代理鉴权，避免凭 key 越权读取整桶对象
  rustfs_init:
    image: minio/mc:${MC_VERSION:-latest}
    container_name: devops-rustfs-init
    depends_on:
      rustfs:
        condition: service_started
    environment:
      RUSTFS_ROOT_USER: ${RUSTFS_ROOT_USER:-rustfsadmin}
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_ROOT_PASSWORD}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-devops_admin}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until mc alias set local http://rustfs:9000 "$${RUSTFS_ROOT_USER}" "$${RUSTFS_ROOT_PASSWORD}"; do
          echo "等待 rustfs 就绪..."; sleep 2
        done
        mc mb --ignore-existing "local/$${RUSTFS_BUCKET}"
        # 收敛匿名下载：先撤整桶匿名，再仅对 uploads/ 前缀放开（头像/媒体公开；其余前缀保持私有）
        mc anonymous set none "local/$${RUSTFS_BUCKET}" || true
        mc anonymous set download "local/$${RUSTFS_BUCKET}/uploads" || true
        echo "rustfs bucket $${RUSTFS_BUCKET} 就绪（匿名下载仅限 uploads/ 前缀）"
    restart: "no"
    networks:
      - prod-net

  # ----------------------------------------------------------------------------
  # LiteLLM：AI 网关模型代理底座（转发面）
  #
  # - 转发面：客户端经 nginx /llm/ 反代（或直暴露 4000）接入，LiteLLM 鉴权虚拟 Key + 路由部署 + 记 spend
  # - 管理面：devops-admin server 容器经 prod-net 走 http://litellm:4000 管理 API（master-key）
  # - 共用现有 PostgreSQL：与业务库同库（devops_admin，pgsql 镜像经 POSTGRES_DB 预建），
  #   LiteLLM 表前缀 LiteLLM_* 不与业务表冲突，对齐 AIHelms 共享 app 库的做法
  # - 端口默认不对宿主暴露，仅经 nginx /llm/ 反代对外（见 nginx.conf）
  # ----------------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:1.99.0
    container_name: devops-litellm
    restart: unless-stopped
    # 宿主直连端口（LITELLM_HOST_PORT，默认仅本机回环 127.0.0.1:4000，安全等同不映射）：
    # - 客户端常规接入走 nginx /llm/ 反代（LITELLM_PUBLIC_URL），无需宿主端口
    # - 宿主 4000 已被其它 litellm 占用时，.env 设 LITELLM_HOST_PORT=4001 过渡；
    #   旧实例停用后改回 4000，docker compose up -d 即完成切换
    ports:
      - "${LITELLM_HOST_PORT:-127.0.0.1:4000}:4000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-devops}:${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD}@pgsql:5432/${POSTGRES_DB:-devops_admin}?schema=public
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?必须设置 LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?必须设置 LITELLM_SALT_KEY}
      STORE_MODEL_IN_DB: "True"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./config/litellm.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml"]
    depends_on:
      pgsql:
        condition: service_healthy
    networks:
      - prod-net

  # ----------------------------------------------------------------------------
  # 在线升级执行器（updater sidecar，参照 SoyDisk 同名组件）
  #
  # - 接收 server 转发的升级指令（prod-net 内网 http://updater:8090，Bearer token 鉴权），
  #   完成 下载(断点续传) → sha256 校验 → 解压 → 发起一次性 install job 容器执行安装
  # - install job 化的原因：up -d 会重建 updater 自身容器，进程内直接跑 compose 会被杀中断；
  #   job 容器由 docker daemon 直管，与 updater 生命周期解耦，能完整跑完安装并写终态
  # - 挂 docker.sock + 安装目录（./ = compose 所在目录）：升级动作的最高权限执行者，
  #   风险收敛：不对宿主暴露端口、写接口 UPDATER_TOKEN 鉴权
  # - root 运行：需访问 docker.sock 与安装目录 root 属主的 .env(600)
  # ----------------------------------------------------------------------------
  updater:
    build:
      context: ../../deploy/updater
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        APP_VERSION: ${APP_VERSION:-dev}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: devops-admin/updater:${APP_VERSION:-prod}
    container_name: devops-updater
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      STACK_DIR: /opt/stack
      # server 与 updater 同源 .env 注入；空 = 不鉴权（仅限可信内网）
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
      # 安装 job 复用本镜像（版本化 tag）与栈网络
      UPDATER_IMAGE: devops-admin/updater:${APP_VERSION:-prod}
      # 实际网络名 = 项目名(name: devops-admin-prod) + '_' + 本文件网络键；
      # 不给网络加显式 name 是为不改动已部署环境的既有网络（避免全容器迁移重建）
      UPDATER_NETWORK: devops-admin-prod_prod-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 安装目录（compose/.env/升级缓存/升级状态文件）；无 ports——仅 prod-net 内网可达
      - ./:/opt/stack
    networks:
      - prod-net

# 同处 prod-net bridge 网络，服务间用服务名互访
# （server → pgsql:5432 / redis:6379 / minio:9000，web → server:8888）
networks:
  prod-net:
    driver: bridge
