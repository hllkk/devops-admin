definitions:
  gateway.Provider:
    properties:
      billingType:
        description: 计费类型
        type: string
      createBy:
        example: "0"
        type: string
      createTime:
        description: |-
          字段名用 gorm 约定的 CreatedAt/UpdatedAt, 由 gorm 自动维护(写入填值、更新刷值);
          column 锁定 create_time/update_time 列名, 沿用历史列不漂移成 created_at/updated_at;
          json 仍叫 createTime/updateTime 对齐前端 CommonRecord。
        type: string
      description:
        description: 描述
        type: string
      isActive:
        description: 是否启用
        type: boolean
      monthlyBudget:
        description: 月预算(USD,nil=不限)
        type: number
      monthlyUsed:
        description: 月已用(USD,用量统计定时回填)
        type: number
      name:
        description: 供应商名称(如 OpenAI/Anthropic)
        type: string
      providerId:
        description: 供应商ID(雪花)
        example: "0"
        type: string
      providerType:
        description: 供应商类型(对应 LiteLLM custom_llm_provider)
        type: string
      updateBy:
        example: "0"
        type: string
      updateTime:
        type: string
    type: object
  request.AiKeyOperateParams:
    properties:
      aiKeyId:
        description: 密钥ID(新增为空)
        example: "0"
        type: string
      budgetDuration:
        description: 预算周期
        type: string
      budgetHardLimit:
        description: 硬限
        type: boolean
      budgetLimit:
        description: 预算上限
        type: number
      description:
        description: 描述
        type: string
      isActive:
        description: 是否启用
        type: boolean
      keyType:
        description: 密钥类型(创建必填)
        type: string
      modelBudgets:
        additionalProperties: {}
        description: 按模型预算
        type: object
      modelLimits:
        additionalProperties: {}
        description: per-model限流
        type: object
      models:
        description: 授权模型(modelKey列表)
        items:
          type: string
        type: array
      name:
        description: 名称
        type: string
      ownerId:
        description: 归属ID(创建必填)
        example: "0"
        type: string
      ownerType:
        description: 归属类型(创建必填)
        type: string
      rateLimitMode:
        description: 限流模式
        type: string
      rpmLimit:
        description: 全局RPM
        type: integer
      tpmLimit:
        description: 全局TPM
        type: integer
    type: object
  request.ChangeMyPasswordParams:
    properties:
      newPassword:
        description: 新密码(明文,复杂度由 service 校验)
        type: string
      oldPassword:
        description: 旧密码(明文,二次校验)
        type: string
    required:
    - newPassword
    - oldPassword
    type: object
  request.CredentialOperateParams:
    properties:
      credentialId:
        description: 凭证ID(新增为空)
        example: "0"
        type: string
      credentialInfo:
        additionalProperties: {}
        description: 凭证元数据(format等)
        type: object
      credentialName:
        description: 凭证名称(全局唯一,创建后不可改)
        type: string
      credentialValues:
        additionalProperties: {}
        description: 凭证键值(api_key/api_base等,明文或掩码回传)
        type: object
      description:
        description: 描述
        type: string
      isActive:
        description: 是否启用
        type: boolean
      providerId:
        description: 关联供应商ID(0=未关联)
        example: "0"
        type: string
    type: object
  request.DBConnTest:
    properties:
      dbName:
        type: string
      dbPath:
        type: string
      dbType:
        type: string
      host:
        type: string
      password:
        type: string
      port:
        type: string
      template:
        type: string
      userName:
        type: string
    type: object
  request.DeploymentOperateParams:
    properties:
      billingType:
        description: 计费类型(空=token)
        type: string
      costPerCall:
        description: 单次成本
        type: number
      credentialId:
        description: 关联凭证(0=内联参数)
        example: "0"
        type: string
      deployName:
        description: 部署名
        type: string
      deploymentId:
        description: 部署ID(新增为空)
        example: "0"
        type: string
      isActive:
        description: 是否启用
        type: boolean
      litellmParams:
        additionalProperties: {}
        description: 路由参数(明文或掩码回传)
        type: object
      modelId:
        description: 关联模型
        example: "0"
        type: string
      modelInfo:
        additionalProperties: {}
        description: 元数据(可选,定价镜像自动重算)
        type: object
      monthlyCallQuota:
        description: 月配额
        type: integer
    type: object
  request.DeploymentTestParams:
    properties:
      deploymentId:
        description: 部署ID
        example: "0"
        type: string
    type: object
  request.DeptOperateParams:
    properties:
      deptCategory:
        description: 部门类别编码
        type: string
      deptId:
        description: 部门ID(新增时为空)
        type: integer
      deptName:
        description: 部门名称
        type: string
      email:
        description: 邮箱
        type: string
      leader:
        description: 负责人用户ID(可空)
        type: integer
      orderNum:
        description: 显示顺序
        type: integer
      parentId:
        description: 父部门ID(空/0=顶层)
        type: integer
      phone:
        description: 联系电话
        type: string
      status:
        description: 部门状态('0'正常/'1'停用)
        type: string
    type: object
  request.DictDataOperateParams:
    properties:
      cssClass:
        description: 样式属性
        type: string
      dictCode:
        description: 字典编码(新增时为空)
        example: "0"
        type: string
      dictLabel:
        description: 字典标签
        type: string
      dictSort:
        description: 字典排序
        type: integer
      dictType:
        description: 字典类型(关联 sys_dict_type.dict_type)
        type: string
      dictValue:
        description: 字典键值
        type: string
      isDefault:
        description: 是否默认(Y/N)
        type: string
      listClass:
        description: 表格回显样式(NaiveUI ThemeColor)
        type: string
      remark:
        description: 备注
        type: string
    type: object
  request.DictTypeOperateParams:
    properties:
      dictId:
        description: 字典主键(新增时为空)
        example: "0"
        type: string
      dictName:
        description: 字典名称
        type: string
      dictType:
        description: 字典类型(唯一)
        type: string
      remark:
        description: 备注
        type: string
    type: object
  request.InitDB:
    properties:
      adminPassword:
        type: string
      dbName:
        description: 数据库名
        type: string
      dbPath:
        description: sqlite数据库文件路径
        type: string
      dbType:
        description: 数据库类型
        type: string
      host:
        description: 服务器地址
        type: string
      initKey:
        description: 系统初始化密钥（配置 init-key 非空时必须匹配）
        type: string
      password:
        description: 数据库密码
        type: string
      port:
        description: 数据库连接端口
        type: string
      redisAddr:
        description: Redis 配置（向导第 2 步采集，随 initdb 一次性提交）
        type: string
      redisDB:
        type: integer
      redisPassword:
        type: string
      template:
        description: postgresql指定template
        type: string
      userName:
        description: 数据库用户名
        type: string
    required:
    - adminPassword
    - dbName
    type: object
  request.Login:
    properties:
      captcha:
        description: 验证码答案(go-captcha 为 JSON 字符串)
        type: string
      captchaId:
        description: 验证码会话 ID
        type: string
      password:
        description: 密码(明文,传输层由网关/加密中间件保护)
        type: string
      username:
        description: 用户名
        type: string
    type: object
  request.MenuOperateParams:
    properties:
      component:
        description: 组件路径
        type: string
      icon:
        description: 菜单图标
        type: string
      isCache:
        description: 是否缓存 0缓存1不缓存
        type: string
      isFrame:
        description: 是否外链 0是1否2iframe
        type: string
      menuId:
        description: 菜单ID(新增时为空)
        type: integer
      menuName:
        description: 菜单名称
        type: string
      menuType:
        description: 菜单类型 M目录C菜单F按钮
        type: string
      module:
        description: 业务模块归属 admin/server/gateway(空=未归属,当全局路由;前端模块隔离来源)
        type: string
      orderNum:
        description: 显示顺序
        type: integer
      parentId:
        description: 父菜单ID(0=顶级)
        type: integer
      path:
        description: 路由地址
        type: string
      perms:
        description: 权限标识
        type: string
      queryParam:
        description: 路由参数
        type: string
      remark:
        description: 备注
        type: string
      status:
        description: 菜单状态 0正常1停用
        type: string
      visible:
        description: 显示状态 0显示1隐藏
        type: string
    type: object
  request.ModelOperateParams:
    properties:
      capabilities:
        description: 能力标签
        items:
          type: string
        type: array
      category:
        description: 类别(空=默认 chat)
        type: string
      description:
        description: 描述
        type: string
      logoProviderType:
        description: LOGO供应商类型
        type: string
      modelId:
        description: 模型ID(新增为空)
        example: "0"
        type: string
      modelKey:
        description: 路由名(全局唯一,可改,改名级联)
        type: string
      name:
        description: 展示名
        type: string
    type: object
  request.ModelPublishParams:
    properties:
      departmentIds:
        description: 可见部门(selected 模式)
        items:
          type: integer
        type: array
      isPublished:
        description: 是否发布
        type: boolean
      modelId:
        description: 模型ID
        example: "0"
        type: string
      requiresApproval:
        description: 订阅需审批
        type: boolean
      visibilityType:
        description: 可见范围(all/selected)
        type: string
    type: object
  request.NoticeOperateParams:
    properties:
      noticeContent:
        description: 公告内容
        type: string
      noticeId:
        description: 公告ID(新增时为空)
        example: "0"
        type: string
      noticeTitle:
        description: 公告标题
        type: string
      noticeType:
        description: 公告类型('1'通知 '2'公告)
        type: string
      status:
        description: 公告状态('0'正常 '1'停用)
        type: string
      targetDeptIds:
        description: 指定部门含子部门(targetType=depts)
        items:
          type: integer
        type: array
      targetType:
        description: 投递范围:all/users/depts(公告强制 all)
        type: string
      targetUserIds:
        description: 指定用户(targetType=users)
        items:
          type: integer
        type: array
    type: object
  request.NoticeReadParams:
    properties:
      noticeIds:
        description: 通知ID列表(空=当前用户全部已读)
        items:
          type: integer
        type: array
    type: object
  request.PingRedis:
    properties:
      addr:
        type: string
      db:
        type: integer
      password:
        type: string
    type: object
  request.PostOperateParams:
    properties:
      deptId:
        description: 部门ID(必填,归属部门)
        example: "0"
        type: string
      postCategory:
        description: 岗位类别编码
        type: string
      postCode:
        description: 岗位编码(唯一)
        type: string
      postId:
        description: 岗位ID(新增时为空)
        example: "0"
        type: string
      postName:
        description: 岗位名称
        type: string
      postSort:
        description: 显示顺序
        type: integer
      remark:
        description: 备注
        type: string
      status:
        description: 岗位状态('0'正常/'1'停用)
        type: string
    type: object
  request.ProviderOperateParams:
    properties:
      billingType:
        description: 计费类型(空=默认 token)
        type: string
      description:
        description: 描述
        type: string
      isActive:
        description: 是否启用
        type: boolean
      monthlyBudget:
        description: 月预算(USD)
        type: number
      name:
        description: 供应商名称
        type: string
      providerId:
        description: 供应商ID(新增为空)
        example: "0"
        type: string
      providerType:
        description: 供应商类型
        type: string
    type: object
  request.PublicSetting:
    properties:
      captchaEnabled:
        description: 验证码(sys_security_config.Captcha*,登录页验证码渲染用)
        type: boolean
      captchaOpen:
        type: integer
      captchaType:
        type: string
      faviconUrl:
        type: string
      giteeEnabled:
        type: boolean
      githubEnabled:
        type: boolean
      imgHeight:
        type: integer
      imgWidth:
        type: integer
      keyLong:
        type: integer
      logoUrl:
        type: string
      registerEnabled:
        description: 认证公开字段（仅公开开关，不暴露密钥）
        type: boolean
      resetPwdEnabled:
        type: boolean
      systemDescription:
        type: string
      systemName:
        description: 系统信息(sys_general_config)
        type: string
      wechatEnabled:
        type: boolean
      wecomEnabled:
        type: boolean
    type: object
  request.Register:
    properties:
      deptId:
        description: 主部门 ID
        example: "0"
        type: string
      email:
        type: string
      nickName:
        type: string
      password:
        type: string
      phonenumber:
        type: string
      roleId:
        description: 主角色 ID
        example: "0"
        type: string
      roleIds:
        description: 多角色
        items:
          type: integer
        type: array
      username:
        type: string
    type: object
  request.ResetUserPwdParams:
    properties:
      password:
        description: 新密码(明文)
        type: string
      userId:
        description: 用户ID
        type: integer
    type: object
  request.RoleOperateParams:
    properties:
      dataScope:
        description: 数据范围档位(1全部2本部门及子级3本部门4仅本人5自定义;仅 dataScope 接口消费)
        example: "0"
        type: string
      defaultRouter:
        description: 默认路由(角色登录后默认打开的路由名;C 菜单 routeKey)
        type: string
      deptCheckStrictly:
        description: 部门树选择项是否关联显示(仅 dataScope 接口消费)
        type: boolean
      deptIds:
        description: 自定义部门集(仅档位5用;全量替换 sys_role_departments)
        items:
          type: integer
        type: array
      menuCheckStrictly:
        description: 菜单树选择项是否关联显示
        type: boolean
      menuIds:
        description: 分配菜单ID(全量;叶子+半选父级)
        items:
          type: integer
        type: array
      remark:
        description: 备注
        type: string
      roleId:
        description: 角色ID(新增时为空)
        type: integer
      roleKey:
        description: 角色权限字符(唯一)
        type: string
      roleName:
        description: 角色名称
        type: string
      roleSort:
        description: 显示顺序
        type: integer
      status:
        description: 角色状态('0'正常/'1'停用)
        type: string
    type: object
  request.SettingConfig:
    properties:
      auth:
        $ref: '#/definitions/system.SysAuthConfig'
      general:
        $ref: '#/definitions/system.SysGeneralConfig'
      ldap:
        $ref: '#/definitions/system.SysLdapConfig'
      notify:
        $ref: '#/definitions/system.SysNotifyConfig'
      security:
        $ref: '#/definitions/system.SysSecurityConfig'
    type: object
  request.SocialLoginForm:
    properties:
      clientId:
        description: 前端环境值(可选,当前不消费)
        type: string
      grantType:
        description: 固定 "social"
        type: string
      socialCode:
        description: 三方授权码 authorization_code
        type: string
      socialState:
        description: GetAuthURL 返回的 base64 state
        type: string
      source:
        description: wechat_open/gitee/github
        type: string
    type: object
  request.TestEmailReq:
    properties:
      emailFromAddr:
        type: string
      emailFromName:
        type: string
      emailHost:
        type: string
      emailPassword:
        type: string
      emailPort:
        type: integer
      emailSSLMode:
        type: string
      emailUsername:
        type: string
      testTo:
        type: string
    type: object
  request.ToggleTimedTask:
    properties:
      ID:
        example: "0"
        type: string
      enabled:
        type: boolean
    required:
    - ID
    type: object
  request.TriggerTimedTask:
    properties:
      ID:
        example: "0"
        type: string
    required:
    - ID
    type: object
  request.UpdateMyProfileParams:
    properties:
      email:
        description: 邮箱
        type: string
      nickName:
        description: 昵称
        type: string
      phonenumber:
        description: 手机号
        type: string
      sex:
        description: 性别 0男1女2未知
        type: string
    type: object
  request.UserOperateParams:
    properties:
      deptId:
        description: 主部门ID
        type: integer
      email:
        description: 邮箱
        type: string
      nickName:
        description: 昵称
        type: string
      password:
        description: 密码(create 必填;update 空=不改)
        type: string
      phonenumber:
        description: 手机号
        type: string
      postIds:
        description: 岗位ID列表(全量替换)
        items:
          type: integer
        type: array
      remark:
        description: 备注
        type: string
      roleIds:
        description: 角色ID列表(全量替换)
        items:
          type: integer
        type: array
      sex:
        description: 性别 0男1女2未知
        type: string
      status:
        description: 状态
        type: string
      userId:
        description: 用户ID(新增时为空)
        type: integer
      userName:
        description: 用户名(create 必填,唯一)
        type: string
    type: object
  response.ActiveModelView:
    properties:
      capabilities:
        description: 能力标签
        items:
          type: string
        type: array
      category:
        description: 类别
        type: string
      description:
        description: 描述
        type: string
      hasAnthropicDeployment:
        description: 是否存在 anthropic 格式活跃部署
        type: boolean
      logoProviderType:
        description: LOGO供应商类型
        type: string
      modelId:
        description: 模型ID
        example: "0"
        type: string
      modelKey:
        description: 路由名(openai 格式组)
        type: string
      modelKeyAnthropic:
        description: anthropic 变体路由名(无 anthropic 部署为空)
        type: string
      name:
        description: 展示名
        type: string
      requiresApproval:
        description: 订阅需审批
        type: boolean
    type: object
  response.AiKeyView:
    properties:
      aiKeyId:
        description: 密钥ID(雪花)
        example: "0"
        type: string
      budgetDuration:
        description: 预算周期
        type: string
      budgetHardLimit:
        description: 硬限
        type: boolean
      budgetLimit:
        description: 预算上限
        type: number
      budgetUsed:
        description: 已用(slice5聚合回填)
        type: number
      createBy:
        example: "0"
        type: string
      createTime:
        description: |-
          字段名用 gorm 约定的 CreatedAt/UpdatedAt, 由 gorm 自动维护(写入填值、更新刷值);
          column 锁定 create_time/update_time 列名, 沿用历史列不漂移成 created_at/updated_at;
          json 仍叫 createTime/updateTime 对齐前端 CommonRecord。
        type: string
      description:
        description: 描述
        type: string
      isActive:
        description: 是否启用(停用=max_budget=0)
        type: boolean
      keyPrefix:
        description: Key前缀(明文前8位+****)
        type: string
      keyType:
        description: 密钥类型
        type: string
      litellmKeyAlias:
        description: LiteLLM key_alias({ownerType}:{ownerId}/{name})
        type: string
      litellmKeyId:
        description: LiteLLM key_id
        type: string
      mcps:
        description: 授权MCP(P2)
        type: object
      modelBudgets:
        additionalProperties: {}
        description: 按模型预算(展开)
        type: object
      modelLimits:
        additionalProperties: {}
        description: per-model限流(展开)
        type: object
      models:
        description: 授权模型(展开)
        items:
          type: string
        type: array
      name:
        description: 密钥名称(主Key固定"主Key")
        type: string
      ownerId:
        description: 归属ID(纯逻辑关联)
        example: "0"
        type: string
      ownerType:
        description: 归属类型
        type: string
      rateLimitMode:
        description: 限流模式
        type: string
      rpmLimit:
        description: 全局RPM
        type: integer
      skills:
        description: 授权Skill(P2)
        type: object
      tpmLimit:
        description: 全局TPM
        type: integer
      updateBy:
        example: "0"
        type: string
      updateTime:
        type: string
    type: object
  response.AvailableModelView:
    properties:
      category:
        description: 类别
        type: string
      hasAnthropicDeployment:
        description: 有anthropic活跃部署
        type: boolean
      modelId:
        description: 模型ID
        example: "0"
