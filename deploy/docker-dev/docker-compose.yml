# ============================================================================
# Dev 环境依赖服务：PostgreSQL + Redis
#
# 用法：
#   docker compose -f deploy/docker-dev/docker-compose.yml up -d       # 启动
#   docker compose -f deploy/docker-dev/docker-compose.yml down        # 停止（保留数据）
#   docker compose -f deploy/docker-dev/docker-compose.yml restart     # 改完配置后重载
#
# 版本 / 端口 / 凭据 / 数据路径均可用环境变量覆盖，例如：
#   PG_PORT=5433 PG_VERSION=17 docker compose -f deploy/docker-dev/docker-compose.yml up -d
#
# 也可在本目录新建 .env 文件持久化覆盖（compose 会自动读取同目录 .env）。
# ============================================================================

services:
  pgsql:
    image: postgres:18-alpine
    container_name: devops-pgsql-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Tricolor_123
      # 不设 POSTGRES_DB：镜像默认建一个与用户同名的 postgres 库，业务库交给 server 初始化向导
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Shanghai
    ports:
      - "15432:5432"
    volumes:
      # PG 18+ 镜像默认 PGDATA=/var/lib/postgresql/18/docker（版本子目录布局），
      # 数据卷需挂到父目录 /var/lib/postgresql，数据最终落在宿主机 .../pgsql/18/docker/
      - /home/docker/docker-dev/pgsql:/var/lib/postgresql
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev-net

  redis:
    image: redis:8-alpine
    container_name: devops-redis-dev
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - /home/docker/docker-dev/redis:/data
      - ./config/redis.conf:/etc/redis/redis.conf:ro
    command: ["redis-server", "/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev-net

  # ============================================================================
  # RustFS：S3 兼容对象存储（MinIO 的 Rust 实现，drop-in 替换）
  #
  # - server 侧 oss-type=minio，minio-go 客户端直连 rustfs，业务代码零改动
  # - user: root 运行，免去 bind mount 目录的属主修正（无需 chown 10001 sidecar）
  # - rustfs 与 MinIO 一样不在启动时自动建 bucket，本项目也无建桶逻辑，
  #   由 rustfs_init 用 mc 建桶，匿名下载收敛到 uploads/ 前缀（头像/媒体公开），
  #   其余私有前缀走后端代理下载鉴权
  # - rustfs 仍处于快速迭代期（官方明确:勿用于生产），本配置面向 dev 环境
  # ============================================================================

  rustfs:
    image: rustfs/rustfs:${RUSTFS_VERSION:-latest}
    container_name: devops-rustfs-dev
    user: root
    restart: unless-stopped
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      RUSTFS_ROOT_USER: rustfsadmin
      RUSTFS_ROOT_PASSWORD: Tricolor_123
      RUSTFS_BROWSER: "on"
    volumes:
      - /home/docker/docker-dev/rustfs:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - dev-net

  # 一次性：rustfs 健康后建 bucket，并将匿名下载收敛到 uploads/ 前缀（撤整桶匿名）
  rustfs_init:
    image: minio/mc:${MC_VERSION:-latest}
    container_name: devops-rustfs-init-dev
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      # 凭证须与上方 rustfs 服务的 RUSTFS_ROOT_USER/PASSWORD 完全一致，否则 mc alias set 签名失败、建桶失败
      RUSTFS_ROOT_USER: rustfsadmin
      RUSTFS_ROOT_PASSWORD: Tricolor_123
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-devops-admin}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://rustfs:9000 "$${RUSTFS_ROOT_USER}" "$${RUSTFS_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${RUSTFS_BUCKET}"
        # 收敛匿名下载：撤整桶匿名，仅对 uploads/ 前缀放开（头像/媒体公开；其余前缀保持私有）
        mc anonymous set none "local/$${RUSTFS_BUCKET}" || true
        mc anonymous set download "local/$${RUSTFS_BUCKET}/uploads" || true
        echo "rustfs bucket $${RUSTFS_BUCKET} 就绪（匿名下载仅限 uploads/ 前缀）"
    restart: "no"
    networks:
      - dev-net

  # ============================================================================
  # LiteLLM：AI 网关模型代理底座（转发面）
  #
  # - 转发面：客户端直连 http://127.0.0.1:4000，LiteLLM 鉴权虚拟 Key + 路由部署 + 记录 spend
  # - 管理面：devops-admin Go 后端（跑宿主机）调 http://127.0.0.1:4000 管理 API（master-key）
  # - 共用 dev pgsql：独立 litellm 库（由 litellm_db_init 建），表前缀 LiteLLM_* 不与业务表冲突
  # - 模型/凭证/密钥由管理面同步进来，本配置只留底座开关（store_model_in_db 等）
  # ============================================================================
  litellm:
    image: ghcr.io/berriai/litellm:1.98.0
    container_name: devops-litellm-dev
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://postgres:Tricolor_123@pgsql:5432/litellm?schema=public
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-devops-litellm-master}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-sk-devops-litellm-salt}
      STORE_MODEL_IN_DB: "True"
      TZ: Asia/Shanghai
    volumes:
      - ./config/litellm.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml"]
    depends_on:
      litellm_db_init:
        condition: service_completed_successfully
    networks:
      - dev-net

  # 一次性：dev pgsql 不预建业务库，litellm 需独立的 litellm 库，由本 sidecar 创建
  litellm_db_init:
    image: postgres:18-alpine
    container_name: devops-litellm-db-init-dev
    environment:
      PGPASSWORD: Tricolor_123
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until pg_isready -h pgsql -U postgres; do echo "等待 pgsql 就绪..."; sleep 1; done
        psql -h pgsql -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='litellm'" | grep -q 1 \
          || psql -h pgsql -U postgres -c "CREATE DATABASE litellm"
        echo "litellm database ready"
    restart: "no"
    depends_on:
      pgsql:
        condition: service_healthy
    networks:
      - dev-net

# 显式 dev 网络：依赖服务同处一网，服务间可用服务名互访（如 rustfs_init → rustfs:9000）。
# server 当前跑宿主机、走端口映射 127.0.0.1 直连；未来 server 容器化时，让其 join dev-net
# 即可改用 pgsql/redis/rustfs 服务名访问。
networks:
  dev-net:
    driver: bridge
