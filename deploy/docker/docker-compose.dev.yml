name: ops-dev

# DevOps Admin 测试环境 Docker Compose
# 端口映射避免与生产环境冲突
# 数据存储到 /home/dev-dockerData 目录

services:
  # ================================
  # PostgreSQL 17 (测试环境)
  # ================================
  postgres:
    image: postgres:17-alpine
    container_name: dev-postgres
    environment:
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devops_pg_2026
      POSTGRES_DB: devops-admin
      TZ: Asia/Shanghai
    volumes:
      - /home/dev-dockerData/postgres:/var/lib/postgresql/data
    ports:
      - "13306:5432"
    command: ["postgres", "-c", "timezone=Asia/Shanghai"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops -d devops-admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dev-net

  # ================================
  # Redis 8 (测试环境)
  # ================================
  redis:
    image: redis:8-alpine
    container_name: dev-redis
    command: redis-server --requirepass devops_redis_2026 --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - /home/dev-dockerData/redis:/data
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "devops_redis_2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dev-net

  # ================================
  # OnlyOffice 文档服务 (测试环境)
  # ================================
  documentserver:
    image: moqisoft/documentserver:9.3.10
    container_name: dev-documentserver
    environment:
      - JWT_ENABLED=true
      - TZ=Asia/Shanghai
      - ALLOW_PRIVATE_IP_ADDRESS=true
      - JWT_SECRET=53f82208d65f2995fa76ac477f10d8c80883d99b23e25ab52e80571591135263
    volumes:
      - /home/dev-dockerData/onlyoffice-data:/var/lib/onlyoffice
      - /home/dev-dockerData/onlyoffice-logs:/var/log/onlyoffice
    ports:
      - "18443:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dev-net

  # ================================
  # RustFS 对象存储 (测试环境)
  # ================================
  rustfs:
    image: rustfs/rustfs:latest
    container_name: dev-rustfs
    user: root
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      RUSTFS_ROOT_USER: devops-admin
      RUSTFS_ROOT_PASSWORD: devops_rustfs_2026
      RUSTFS_BROWSER: "on"
    volumes:
      - /home/dev-dockerData/rustfs:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - dev-net

  # ================================
  # litellm AI 网关数据面 (测试环境)
  # 转发面对齐 AIHelms：客户端(含本地 go run 的 backend)直连此服务虚拟 key 转发
  # Go backend 仅作管理面，经 litellm Admin API 管理 credentials/models/keys
  # DATABASE_URL 指向同库 dev-postgres，schema=public(litellm 表)与 gateway schema 隔离
  # 测试环境固定配置；生产待迁移 PG 后在 docker-compose.yml 同方式集成(经 .env)
  # ================================
  litellm:
    image: ghcr.io/berriai/litellm:v1.91.0
    container_name: dev-litellm
    environment:
      DATABASE_URL: postgresql://devops:devops_pg_2026@postgres:5432/devops-admin?schema=public
      LITELLM_MASTER_KEY: sk-devops-litellm-master-2026
      LITELLM_SALT_KEY: devops-litellm-salt-2026
      STORE_MODEL_IN_DB: "true"
      TZ: Asia/Shanghai
    volumes:
      - ./litellm/litellm.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    command: ["--config", "/app/config.yaml"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/liveliness"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dev-net

networks:
  dev-net:
    driver: bridge