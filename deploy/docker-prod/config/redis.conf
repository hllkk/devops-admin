# ============================================================================
# 生产环境 Redis 主配置
#
# 挂载方式：docker-compose 把本文件映射到 /etc/redis/redis.conf
# 启动命令：redis-server /etc/redis/redis.conf --requirepass <来自 .env 的 REDIS_PASSWORD>
#
# 修改后重载（数据不丢）：
#   docker compose -f deploy/docker-prod/docker-compose.yml restart redis
#
# 注意：Redis 配置文件不支持行内注释（# 仅在行首作为注释生效），
#       因此本文件所有注释都独占一行。密码由 compose 启动参数注入，本文件不存明文。
# ============================================================================

# ---------- 网络 ----------
bind * -::*
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ---------- 通用 ----------
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 16
always-show-logo yes

# ---------- 内存上限与淘汰策略 ----------
maxmemory 512mb
maxmemory-policy allkeys-lru

# ---------- 持久化（RDB，落盘到 /data）----------
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ---------- AOF（生产开启，提升数据安全）----------
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
