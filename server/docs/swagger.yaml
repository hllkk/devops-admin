definitions:
  gateway.BalanceSyncConfig:
    properties:
      accessKeyId:
        description: 阿里云 AccessKey ID
        type: string
      accessKeySecret:
        description: 阿里云 AccessKey Secret
        type: string
      region:
        description: 服务地域(默认 cn-beijing,Token Plan 仅支持北京)
        type: string
    type: object
  gateway.FallbackItem:
    properties:
      fallbacks:
        description: 降级到的模型 ID 列表
        items:
          type: string
        type: array
      model:
        description: 源模型 ID(model_key)
        type: string
    type: object
  gateway.KeyScenario:
    properties:
      createBy:
        example: "0"
        type: string
      createTime:
        description: |-
          字段名用 gorm 约定的 CreatedAt/UpdatedAt, 由 gorm 自动维护(写入填值、更新刷值);
          column 锁定 create_time/update_time 列名, 沿用历史列不漂移成 created_at/updated_at;
          json 仍叫 createTime/updateTime 对齐前端 CommonRecord。
        type: string
      description:
        description: 描述
        type: string
      isActive:
        description: 是否启用
        type: boolean
      name:
        description: 场景名称(未软删行唯一)
        type: string
      scenarioId:
        description: 场景ID(雪花)
        example: "0"
        type: string
      updateBy:
        example: "0"
        type: string
      updateTime:
        type: string
    type: object
  gateway.LlmLog:
    properties:
      aiKeyId:
        description: 归因AiKey
        example: "0"
        type: string
      cacheCreationTokens:
        description: cache_creation
        type: integer
      cacheReadTokens:
        description: cache_read
        type: integer
      callType:
        description: call_type
        type: string
      completionTokens:
        description: completion_tokens
        type: integer
      createTime:
        description: |-
          字段名用 gorm 约定的 CreatedAt/UpdatedAt, 由 gorm 自动维护(写入填值、更新刷值);
          column 锁定 create_time/update_time 列名, 沿用历史列不漂移成 created_at/updated_at;
          json 仍叫 createTime/updateTime 对齐前端 CommonRecord。
        type: string
      deploymentId:
        description: 归因ModelDeployment
        example: "0"
        type: string
      durationMs:
        description: duration_ms
        type: integer
      endedAt:
        description: ended_at(UTC)
        type: string
      externalCost:
        description: external_cost
        type: number
      internalCost:
        description: internal_cost
        type: number
      logId:
        description: 日志ID(雪花)
        example: "0"
        type: string
      metadata:
        description: metadata
        type: object
      model:
        description: 请求时 model_name(含前缀/变体)
        type: string
      promptTokens:
        description: prompt_tokens
        type: integer
      provider:
        description: custom_llm_provider
        type: string
      requestId:
        description: LiteLLM request_id
        type: string
      sessionId:
        description: session_id
        type: string
      startedAt:
        description: started_at(UTC)
        type: string
      syncedAt:
        description: synced_at
        type: string
      totalTokens:
        description: total_tokens
        type: integer
      updateTime:
        type: string
      userId:
        description: 归因用户(纯逻辑关联 sys_users)
        example: "0"
        type: string
    type: object
  gateway.Provider:
    properties:
      createBy:
        example: "0"
        type: string
      createTime:
        description: |-
          字段名用 gorm 约定的 CreatedAt/UpdatedAt, 由 gorm 自动维护(写入填值、更新刷值);
          column 锁定 create_time/update_time 列名, 沿用历史列不漂移成 created_at/updated_at;
          json 仍叫 createTime/updateTime 对齐前端 CommonRecord。
        type: string
      credentialCount:
        description: 凭证数(列表展示,service 层填充,不入库)
        type: integer
      description:
        description: 描述
        type: string
      isActive:
        description: 是否启用
        type: boolean
      name:
        description: 供应商名称(如 OpenAI/Anthropic)
        type: string
      providerId:
        description: 供应商ID(雪花)
        example: "0"
        type: string
      providerType:
        description: 供应商类型(对应 LiteLLM custom_llm_provider)
        type: string
      supportedFormats:
        description: 支持的接入格式(凭证 format 从中选)
        type: object
      updateBy:
        example: "0"
        type: string
      updateTime:
        type: string
    type: object
  gateway.ProviderBalance:
    properties:
      balanceId:
        description: 余量ID
        example: "0"
        type: string
      createTime:
        description: |-
          字段名用 gorm 约定的 CreatedAt/UpdatedAt, 由 gorm 自动维护(写入填值、更新刷值);
          column 锁定 create_time/update_time 列名, 沿用历史列不漂移成 created_at/updated_at;
          json 仍叫 createTime/updateTime 对齐前端 CommonRecord。
        type: string
      cycleEnd:
        description: 周期结束
        type: string
      cycleStart:
        description: 周期开始
        type: string
      equityType:
        description: 权益类型
        type: string
      itemKey:
        description: 条目键
        type: string
      itemName:
        description: 条目名称
        type: string
      itemType:
        description: 条目类型
        type: string
      planType:
        description: 套餐类型
        type: string
      providerId:
        description: 供应商ID
        example: "0"
        type: string
      raw:
        description: 原始返回
        type: object
      specType:
        description: 坐席档位
        type: string
      status:
        description: 条目状态
        type: string
      surplusValue:
        description: 剩余额度
        type: number
      syncedAt:
        description: 同步时间
        type: string
      totalValue:
        description: 总额度
        type: number
      updateTime:
        type: string
      usedValue:
        description: 已用额度
        type: number
    type: object
  request.AiKeyBatchCreateParams:
    properties:
      deptId:
        description: 按部门开通(优先,取部门下全部用户)
        example: "0"
        type: string
      userIds:
        description: 目标用户ID列表(与 deptId 至少一项;雪花id字符串/数字元素兼容)
        items:
          type: integer
        type: array
    type: object
  request.AiKeyBatchSceneCreateParams:
    properties:
      budgetDuration:
        description: 预算周期
        type: string
      budgetHardLimit:
        description: 硬限
        type: boolean
      budgetLimit:
        description: 预算上限
        type: number
      deptId:
        description: 按部门(优先,取部门下全部用户)
        example: "0"
        type: string
      description:
        description: 描述
        type: string
      expiresAt:
        description: 过期时间(nil=永不过期)
        type: string
      isActive:
        description: 是否启用(nil=默认启用)
        type: boolean
      mcps:
        description: 授权MCP(serverName列表)
        items:
          type: string
        type: array
      modelBudgets:
        additionalProperties: {}
        description: 按模型预算
        type: object
      modelLimits:
        additionalProperties: {}
        description: per-model限流
        type: object
      models:
        description: 授权模型(空=场景Key无默认,显式空数组)
        items:
          type: string
        type: array
      nameTemplate:
        description: 名称模板(必填,{username}/{nickname}占位)
        type: string
      rateLimitMode:
        description: 限流模式
        type: string
      rpmLimit:
        description: 全局RPM
        type: integer
      scenarioId:
        description: 场景ID(可选,须为启用中场景)
        example: "0"
        type: string
      skills:
        description: 授权Skill(skillId字符串列表)
        items:
          type: string
        type: array
      tpmLimit:
        description: 全局TPM
        type: integer
      userIds:
        description: 目标用户ID列表(与 deptId 至少一项)
        items:
          type: integer
        type: array
    type: object
  request.AiKeyOperateParams:
    properties:
      aiKeyId:
        description: 密钥ID(新增为空)
        example: "0"
        type: string
      budgetDuration:
        description: 预算周期
        type: string
      budgetHardLimit:
        description: 硬限
        type: boolean
      budgetLimit:
        description: 预算上限
        type: number
      description:
        description: 描述
        type: string
      expiresAt:
        description: 过期时间(nil=永不过期,覆盖式更新)
        type: string
      isActive:
        description: 是否启用
        type: boolean
      keyType:
        description: 密钥类型(创建必填)
        type: string
      mcps:
        description: 授权MCP(serverName列表,nil=不改,空=清空)
        items:
          type: string
        type: array
      modelBudgets:
        additionalProperties: {}
        description: 按模型预算
        type: object
      modelLimits:
        additionalProperties: {}
        description: per-model限流
        type: object
      models:
        description: 授权模型(modelKey列表)
        items:
          type: string
        type: array
      name:
        description: 名称
        type: string
      ownerId:
        description: 归属ID(创建必填)
        example: "0"
        type: string
      ownerType:
        description: 归属类型(创建必填)
        type: string
      rateLimitMode:
        description: 限流模式
        type: string
      rpmLimit:
        description: 全局RPM
        type: integer
      scenarioId:
        description: 场景ID(场景Key可填;nil=清空/主Key恒0;须为未软删且启用的场景)
        example: "0"
        type: string
      skills:
        description: 授权Skill(skillId字符串列表,nil=不改,空=清空)
        items:
          type: string
        type: array
      tpmLimit:
        description: 全局TPM
        type: integer
    type: object
  request.ApplicationBatchReviewParams:
    properties:
      applicationIds:
        description: 申请ID列表
        items:
          type: integer
        type: array
      reviewNotes:
        description: 审批意见(批量统一)
        type: string
    required:
    - applicationIds
    type: object
  request.ApplicationCreateParams:
    properties:
      reason:
        description: 申请理由
        type: string
      resourceId:
        description: 资源ID
        example: "0"
        type: string
      resourceType:
        description: 资源类型(model/mcp/skill)
        type: string
    required:
    - resourceId
    - resourceType
    type: object
  request.ApplicationReviewParams:
    properties:
      applicationId:
        description: 申请ID
        example: "0"
        type: string
      reviewNotes:
        description: 审批意见(可空)
        type: string
    required:
    - applicationId
    type: object
  request.BudgetRuleOperateParams:
    properties:
      budgetDuration:
        description: 预算周期(1d/7d/30d)
        type: string
      budgetHardLimit:
        description: 硬限
        type: boolean
      budgetLimit:
        description: 预算上限(¥,0=不限)
        type: number
      isActive:
        description: 启停(nil=不改)
        type: boolean
      ruleId:
        description: 规则ID(修改时必填)
        example: "0"
        type: string
      scopeId:
        description: 对象ID(部门ID/用户ID)
        example: "0"
        type: string
      scopeType:
        description: 维度(dept/user)
        type: string
      softWarnPercent:
        description: 软限预警阈值(%)
        type: integer
    type: object
  request.ChangeMyPasswordParams:
    properties:
      newPassword:
        description: 新密码(明文,复杂度由 service 校验)
        type: string
      oldPassword:
        description: 旧密码(明文,二次校验)
        type: string
    required:
    - newPassword
    - oldPassword
    type: object
  request.CredentialOperateParams:
    properties:
      credentialId:
        description: 凭证ID(新增为空)
        example: "0"
        type: string
      credentialInfo:
        additionalProperties: {}
        description: 凭证元数据(format等)
        type: object
      credentialName:
        description: 凭证名称(全局唯一,创建后不可改)
        type: string
      credentialValues:
        additionalProperties: {}
        description: 凭证键值(api_key/api_base等,明文或掩码回传)
        type: object
      description:
        description: 描述
        type: string
      isActive:
        description: 是否启用
        type: boolean
      providerId:
        description: 关联供应商ID(0=未关联)
        example: "0"
        type: string
    type: object
  request.DBConnTest:
    properties:
      dbName:
        type: string
      dbPath:
        type: string
      dbType:
        type: string
      host:
        type: string
      password:
        type: string
      port:
        type: string
      template:
        type: string
      userName:
        type: string
    type: object
  request.DeploymentOperateParams:
    properties:
      billingType:
        description: 计费类型(空=token)
        type: string
      costPerCall:
        description: 单次成本
        type: number
      credentialId:
        description: 关联凭证(0=内联参数)
        example: "0"
        type: string
      deployName:
        description: 部署名
        type: string
      deploymentId:
        description: 部署ID(新增为空)
        example: "0"
        type: string
      isActive:
        description: 是否启用
        type: boolean
      litellmParams:
        additionalProperties: {}
        description: 路由参数(明文或掩码回传)
        type: object
      modelId:
        description: 关联模型
        example: "0"
        type: string
      modelInfo:
        additionalProperties: {}
        description: 元数据(可选,定价镜像自动重算)
        type: object
      monthlyCallQuota:
        description: 月配额
        type: integer
    type: object
  request.DeploymentTestParams:
    properties:
      deploymentId:
        description: 部署ID
        example: "0"
        type: string
    type: object
  request.DeptOperateParams:
    properties:
      deptCategory:
        description: 部门类别编码
        type: string
      deptId:
        description: 部门ID(新增时为空)
        type: integer
      deptName:
        description: 部门名称
        type: string
      email:
        description: 邮箱
        type: string
      leader:
        description: 负责人用户ID(可空)
        type: integer
      orderNum:
        description: 显示顺序
        type: integer
      parentId:
        description: 父部门ID(空/0=顶层)
        type: integer
      phone:
        description: 联系电话
        type: string
      status:
        description: 部门状态('0'正常/'1'停用)
        type: string
    type: object
  request.DictDataOperateParams:
    properties:
      cssClass:
        description: 样式属性
        type: string
      dictCode:
        description: 字典编码(新增时为空)
        example: "0"
        type: string
      dictLabel:
        description: 字典标签
        type: string
      dictSort:
        description: 字典排序
        type: integer
      dictType:
        description: 字典类型(关联 sys_dict_type.dict_type)
        type: string
      dictValue:
        description: 字典键值
        type: string
      isDefault:
        description: 是否默认(Y/N)
        type: string
      listClass:
        description: 表格回显样式(NaiveUI ThemeColor)
        type: string
      remark:
        description: 备注
        type: string
    type: object
  request.DictTypeOperateParams:
    properties:
      dictId:
        description: 字典主键(新增时为空)
        example: "0"
        type: string
      dictName:
        description: 字典名称
        type: string
      dictType:
        description: 字典类型(唯一)
        type: string
      remark:
        description: 备注
        type: string
    type: object
  request.IdsReq:
    properties:
      ids:
        description: ID列表(string对齐前端,雪花ID传输为string)
        items:
          type: string
        type: array
    type: object
  request.InitDB:
    properties:
      adminPassword:
        type: string
      dbName:
        description: 数据库名
        type: string
      dbPath:
        description: sqlite数据库文件路径
        type: string
      dbType:
        description: 数据库类型
        type: string
      host:
        description: 服务器地址
        type: string
      initKey:
        description: 系统初始化密钥（配置 init-key 非空时必须匹配）
        type: string
      password:
        description: 数据库密码
        type: string
      port:
        description: 数据库连接端口
        type: string
      redisAddr:
        description: Redis 配置（向导第 2 步采集，随 initdb 一次性提交）
        type: string
      redisDB:
        type: integer
      redisPassword:
        type: string
      template:
        description: postgresql指定template
        type: string
      userName:
        description: 数据库用户名
        type: string
    required:
    - adminPassword
    - dbName
    type: object
  request.KeyScenarioOperateParams:
    properties:
      description:
        description: 描述
        type: string
      isActive:
        description: 启停(nil=新增默认true/修改不改)
        type: boolean
      name:
        description: 名称
        type: string
      scenarioId:
        description: 场景ID(新增为空)
        example: "0"
        type: string
    type: object
  request.Login:
    properties:
      captcha:
        description: 验证码答案(go-captcha 为 JSON 字符串)
        type: string
      captchaId:
        description: 验证码会话 ID
        type: string
      password:
        description: 密码(明文,传输层由网关/加密中间件保护)
        type: string
      username:
        description: 用户名
        type: string
    type: object
  request.MCPPublishParams:
    properties:
      departmentIds:
        description: 可见部门(selected/mixed 模式)
        items:
          type: integer
        type: array
      isPublished:
        description: 是否发布
        type: boolean
      mcpServerId:
        description: 服务器ID
        example: "0"
        type: string
      requiresApproval:
        description: 接入需审批
        type: boolean
      userIds:
        description: 可见用户(user/mixed 模式)
        items:
          type: integer
        type: array
      visibilityType:
        description: 可见范围(all/selected/user/mixed)
        type: string
    type: object
  request.MCPServerOperateParams:
    properties:
      authType:
        description: 鉴权方式(none/api_key/bearer_token)
        type: string
      author:
        description: 提供方
        type: string
      billingType:
        description: 计费类型(per_call/free)
        type: string
      category:
        description: 分类
        type: string
      credentials:
        additionalProperties: {}
        description: 鉴权凭据(明文入网,掩码回传=保留旧值)
        type: object
      description:
        description: 描述
        type: string
      documentationUrl:
        description: 文档地址
        type: string
      externalCostPerCall:
        description: 单次调用价(¥,nil=免费)
        type: number
      iconUrl:
        description: 图标URL
        type: string
      instructions:
        description: 使用说明
        type: string
      internalCostPerCall:
        description: 单次调用内部结算价(¥,nil=同外部价)
        type: number
      isActive:
        description: 是否启用(nil=不改)
        type: boolean
      mcpServerId:
        description: 服务器ID(新增为空)
        example: "0"
        type: string
      name:
        description: 展示名称
        type: string
      serverName:
        description: LiteLLM 路由名(唯一,禁-)
        type: string
      transport:
        description: 传输协议(sse/streamable_http)
        type: string
      url:
        description: MCP 端点
        type: string
    type: object
  request.MCPToolBillingParams:
    properties:
      billingType:
        description: 计费类型(per_call/free/空=继承)
        type: string
      externalCostPerCall:
        description: 单次调用价(¥,nil=继承)
        type: number
      internalCostPerCall:
        description: 单次调用内部价(¥,nil=继承/同外部价)
        type: number
    type: object
  request.MenuOperateParams:
    properties:
      component:
        description: 组件路径
        type: string
      icon:
        description: 菜单图标
        type: string
      isCache:
        description: 是否缓存 0缓存1不缓存
        type: string
      isFrame:
        description: 是否外链 0是1否2iframe
        type: string
      menuId:
        description: 菜单ID(新增时为空)
        type: integer
      menuName:
        description: 菜单名称
        type: string
      menuType:
        description: 菜单类型 M目录C菜单F按钮
        type: string
      module:
        description: 业务模块归属 admin/server/gateway(空=未归属,当全局路由;前端模块隔离来源)
        type: string
      orderNum:
        description: 显示顺序
        type: integer
      parentId:
        description: 父菜单ID(0=顶级)
        type: integer
      path:
        description: 路由地址
        type: string
      perms:
        description: 权限标识
        type: string
      queryParam:
        description: 路由参数
        type: string
      remark:
        description: 备注
        type: string
      status:
        description: 菜单状态 0正常1停用
        type: string
      visible:
        description: 显示状态 0显示1隐藏
        type: string
    type: object
  request.ModelOperateParams:
    properties:
      capabilities:
        description: 能力标签
        items:
          type: string
        type: array
      category:
        description: 类别(空=默认 chat)
        type: string
      description:
        description: 描述
        type: string
      logoProviderType:
        description: LOGO供应商类型
        type: string
      modelId:
        description: 模型ID(新增为空)
        example: "0"
