upstream backend {
    server backend:8888;
}

upstream onlyoffice {
    server onlyoffice:80;
}

# 双层代理：优先使用上游传递的协议头，否则回退到 $scheme
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 500m;

    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        # 禁止缓存html文件,避免前端页面不及时更新，需要用户手动刷新的情况
        if ($request_uri ~* "^/$|^/index.html|^/index.htm") {
             add_header Cache-Control "no-store";
        }
    }

    # 企业微信登录回调（重写到后端 /api/v1 前缀下）
    location /wecomCallback {
        proxy_pass http://backend/api/v1/wecomCallback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # 文件上传/合并超时（合并大文件可能耗时较长）
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # OnlyOffice 文档服务
    location /office/ {
        proxy_pass http://onlyoffice/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host/office;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_http_version 1.1;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header Cache-Control no-cache;
    }

    # OnlyOffice 回调（需要后端处理）
    location /api/v1/office-callback {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
