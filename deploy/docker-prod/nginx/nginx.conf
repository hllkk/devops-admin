# ============================================================================
# 生产 nginx：托管前端 SPA + 反代后端 API
#
# 由 docker-compose 以只读卷挂载到 /etc/nginx/nginx.conf
# 前端 baseURL(/proxy-default) 请求被转发到 server:8888，转发时去掉前缀
# ============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;          # 隐藏 nginx 版本号

    # 压缩
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml application/xml+rss image/svg+xml;

    # 上游后端（compose 服务名）
    upstream backend {
        server server:8888;
    }

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # 基础安全响应头（HTTPS/严格传输由外层反代按需补 HSTS）
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 大文件上传（网盘模块）；按需调整上限
        client_max_body_size 1024m;

        # ---- 后端 API 反代：/proxy-default/* → server:8888/*（去掉前缀）----
        location /proxy-default/ {
            proxy_pass http://backend/;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE / 长连接：关闭缓冲，放宽超时
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            # WebSocket（VITE_APP_WEBSOCKET 启用时需要）
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 示例：其它后端服务前缀（对应 .env.prod 的 VITE_OTHER_SERVICE_BASE_URL）
        # location /proxy-demo/ {
        #     proxy_pass http://backend/;
        #     proxy_set_header Host $host;
        # }

        # ---- 对象存储文件下载（前端直链；anonymous download 模式下公开可下载）----
        # bucket-url 形如 /oss/devops_admin/xxx，反代到 rustfs:9000/devops_admin/xxx
        # rustfs 端口不对宿主暴露，下载统一经此同源反代
        location /oss/ {
            proxy_pass http://rustfs:9000/;
            proxy_set_header Host $host;
        }

        # ---- 静态资源缓存 ----
        location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # ---- SPA history 路由兜底 ----
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
