# ============================================================================
# Dev 环境 Redis 主配置
#
# 挂载方式：docker-compose 把本文件映射到 /etc/redis/redis.conf
# 启动命令：redis-server /etc/redis/redis.conf
#
# 修改后重载（数据不丢）：
#   docker compose -f deploy/docker-dev/docker-compose.yml restart redis
#
# 注意：Redis 配置文件不支持行内注释（# 仅在行首作为注释生效），
#       因此本文件所有注释都独占一行。
# ============================================================================

# ---------- 网络 ----------
# 监听所有网卡
bind * -::*
# dev 无密码直连（对齐 server/config.yaml 中 password 为空）
protected-mode no
port 6379
tcp-backlog 511
# 0 = 不主动断开空闲连接
timeout 0
tcp-keepalive 300

# ---------- 通用 ----------
# 必须前台运行，docker 依赖主进程存活
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
# 空字符串表示日志输出到 stdout，docker logs 可见
logfile ""
databases 16
always-show-logo yes

# ---------- 内存上限与淘汰策略 ----------
maxmemory 256mb
maxmemory-policy allkeys-lru

# ---------- 持久化（RDB，落盘到 /data）----------
# 900s 内至少 1 次修改则快照
save 900 1
# 300s 内至少 10 次修改
save 300 10
# 60s 内至少 10000 次修改
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
# 数据目录，挂载到宿主机 /home/docker/docker-dev/redis
dir /data

# ---------- AOF（dev 关闭，使用 RDB）----------
appendonly no
