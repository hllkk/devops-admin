autocode:
    web: web/src
    root: /home/devops-admin
    server: server
    module: github.com/hllkk/devops-admin/server
    ai-path: ""
captcha:
    key-long: 6
    img-width: 240
    img-height: 80
    open-captcha: 0
    open-captcha-timeout: 3600
    go-captcha:
        enabled: true
        type: click
        store: redis
        key-prefix: 'gocaptcha:'
        expire-seconds: 120
        trigger:
            mode: threshold
            fail-threshold: 1
            fail-window: 600
        slide:
            tolerance: 8
        click:
            padding: 8
        rotate:
            tolerance: 8
cors:
    mode: strict-whitelist
    whitelist:
        - allow-origin: http://localhost:8080
          allow-methods: POST,GET,PUT,DELETE,OPTIONS
          allow-headers: Content-Type,AccessToken,X-CSRF-Token,Authorization,Token,X-Token,X-User-Id,x-request-id,apifoxtoken
          expose-headers: Content-Length,Access-Control-Allow-Origin,Access-Control-Allow-Headers,Content-Type,New-Token,New-Expires-At,Download-Filename
          allow-credentials: true
        - allow-origin: http://127.0.0.1:8080
          allow-methods: POST,GET,PUT,DELETE,OPTIONS
          allow-headers: Content-Type,AccessToken,X-CSRF-Token,Authorization,Token,X-Token,X-User-Id,x-request-id,apifoxtoken
          expose-headers: Content-Length,Access-Control-Allow-Origin,Access-Control-Allow-Headers,Content-Type,New-Token,New-Expires-At,Download-Filename
          allow-credentials: true
