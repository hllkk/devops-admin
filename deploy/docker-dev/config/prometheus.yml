# dev Prometheus 抓取配置：HTTP SD 指向宿主机 go run 的后端。
# SD token 与 server/config.yaml 的 server.prometheus.sd-token 保持一致(dev-sd-token)。
global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: node
    http_sd_configs:
      - url: http://host.docker.internal:8888/prometheus/sd
        refresh_interval: 1m
        authorization:
          type: Bearer
          credentials_file: /run/sd.token
