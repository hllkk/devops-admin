services:
  # ================================
  # Nginx 反向代理 + 前端静态资源
  # ================================
  nginx:
    image: nginx:1.30-alpine
    container_name: ops-nginx
    ports:
      - "80:80"
      # - "443:443"  # SSL 启用后取消注释
    volumes:
      - ./conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../frontend/dist:/usr/share/nginx/html:ro  # 前端构建产物
    depends_on:
      backend:
        condition: service_started
      onlyoffice:
        condition: service_started
    restart: unless-stopped
    networks:
      - ops-net

  # ================================
  # Go 后端
  # ================================
  backend:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
    container_name: ops-backend
    environment:
      - TZ=Asia/Shanghai
      - DOCKER_ENV=true
      - GIN_MODE=release
      - INIT_ADMIN_PASSWORD=${INIT_ADMIN_PASSWORD:-Admin@2026}  # 初始化管理员密码
    volumes:
      - /home/docker/app-storage:/app/storage
      - /home/docker/app-logs:/app/log
      - ./conf/config.yaml:/app/conf/config.yaml:ro  # 覆盖配置
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ops-net

  # ================================
  # MySQL 8.4
  # ================================
  mysql:
    image: mysql:8.4
    container_name: ops-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devops_admin_2026}
      MYSQL_DATABASE: devops_admin
      TZ: Asia/Shanghai
    volumes:
      - /home/docker/mysql:/var/lib/mysql
      - ./scripts/init-mysql.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=500
      --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ops-net

  # ================================
  # Redis 8
  # ================================
  redis:
    image: redis:8-alpine
    container_name: ops-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-devops_redis_2026} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - /home/docker/redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devops_redis_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ops-net

  # ================================
  # OnlyOffice 文档服务
  # ================================
  onlyoffice:
    image: moqisoft/documentserver:9.3.10
    container_name: ops-onlyoffice
    environment:
      - JWT_ENABLED=false
      - TZ=Asia/Shanghai
    volumes:
      - /home/docker/onlyoffice-data:/var/lib/onlyoffice
      - /home/docker/onlyoffice-logs:/var/log/onlyoffice
    ports:
      - "8443:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - ops-net

  # ================================
  # RustFS 对象存储
  # ================================
  rustfs:
    image: rustfs/rustfs:latest
    container_name: ops-rustfs
    user: root  # 以root用户运行，避免权限问题
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web 管理控制台
    environment:
      RUSTFS_ROOT_USER: ${RUSTFS_ROOT_USER:-devops-admin}
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_ROOT_PASSWORD:-devops_rustfs_2026}
      RUSTFS_BROWSER: "on"
    volumes:
      - /home/docker/rustfs:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - ops-net
# ================================
# 网络
# ================================
networks:
  ops-net:
    driver: bridge