info:
  contact: {}
  description: 使用devops-admin进行开发基础平台
  title: Devops-Admin Swagger API接口文档
  version: v0.2.0
paths:
  /base/captcha:
    get:
      parameters:
      - description: 用户名(触发阈值判断)
        in: query
        name: username
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/system.CaptchaResult'
                msg:
                  type: string
              type: object
      summary: 生成验证码(go-captcha 行为验证)
      tags:
      - Base
  /base/login:
    post:
