# AI 网关 litellm 数据面(独立测试部署)。DATABASE_URL 指向测试 PG(devops-admin 库, schema=public)
# 使用: LITELLM_MASTER_KEY=sk-xxx LITELLM_SALT_KEY=xxx LITELLM_PG_PASSWORD=xxx \
#      docker compose -f deploy/docker/docker-compose.litellm.yml up -d
name: ops-litellm
services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.85.1
    container_name: ops-litellm
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${LITELLM_PG_USER:-devops}:${LITELLM_PG_PASSWORD:?须设置PG密码}@${LITELLM_PG_HOST:?须设置PG地址}:${LITELLM_PG_PORT:-13306}/${LITELLM_PG_DB:-devops-admin}?schema=public
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?须设置litellm master key(sk-开头)}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?须设置litellm salt key}
      STORE_MODEL_IN_DB: "true"
      TZ: Asia/Shanghai
    volumes:
      - ./litellm/litellm.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    command: ["--config", "/app/config.yaml"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/liveliness"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ops-litellm-net
networks:
  ops-litellm-net:
    driver: bridge
