# ============================================================================
# 生产环境 PostgreSQL 主配置
#
# 挂载方式：docker-compose 把本文件映射到 /etc/postgresql/postgresql.conf
# 启动命令：postgres -c config_file=/etc/postgresql/postgresql.conf
#
# 修改后重载（数据不丢）：
#   docker compose -f deploy/docker-prod/docker-compose.yml restart pgsql
#
# 说明：仅列常用项；未列参数沿用编译默认值。
#       不要在此设置 data_directory / hba_file —— 沿用镜像默认（PGDATA）。
#       密码不在本文件出现（由 .env 的 POSTGRES_PASSWORD 注入）。
# ============================================================================

# ---------- 连接 ----------
listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 3

# ---------- 内存 / 资源（按容器内存酌情调整）----------
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 4MB
maintenance_work_mem = 128MB

# ---------- 时区 / 区域 ----------
timezone = 'Asia/Shanghai'
log_timezone = 'Asia/Shanghai'

# ---------- 日志（走 stdout，docker logs 可见）----------
logging_collector = off
log_destination = 'stderr'
log_min_messages = warning
log_statement = 'none'
log_duration = off
log_line_prefix = '%m [%p] %u@%d '

# ---------- 自动清理 ----------
autovacuum = on
