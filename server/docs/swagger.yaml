definitions:
  request.ChangeMyPasswordParams:
    properties:
      newPassword:
        description: 新密码(明文,复杂度由 service 校验)
        type: string
      oldPassword:
        description: 旧密码(明文,二次校验)
        type: string
    required:
    - newPassword
    - oldPassword
    type: object
  request.DBConnTest:
    properties:
      dbName:
        type: string
      dbPath:
        type: string
      dbType:
        type: string
      host:
        type: string
      password:
        type: string
      port:
        type: string
      template:
        type: string
      userName:
        type: string
    type: object
  request.DeptOperateParams:
    properties:
      deptCategory:
        description: 部门类别编码
        type: string
      deptId:
        description: 部门ID(新增时为空)
        type: integer
      deptName:
        description: 部门名称
        type: string
      email:
        description: 邮箱
        type: string
      leader:
        description: 负责人用户ID(可空)
        type: integer
      orderNum:
        description: 显示顺序
        type: integer
      parentId:
        description: 父部门ID(空/0=顶层)
        type: integer
      phone:
        description: 联系电话
        type: string
      status:
        description: 部门状态('0'正常/'1'停用)
        type: string
    type: object
  request.DictDataOperateParams:
    properties:
      cssClass:
        description: 样式属性
        type: string
      dictCode:
        description: 字典编码(新增时为空)
        example: "0"
        type: string
      dictLabel:
        description: 字典标签
        type: string
      dictSort:
        description: 字典排序
        type: integer
      dictType:
        description: 字典类型(关联 sys_dict_type.dict_type)
        type: string
      dictValue:
        description: 字典键值
        type: string
      isDefault:
        description: 是否默认(Y/N)
        type: string
      listClass:
        description: 表格回显样式(NaiveUI ThemeColor)
        type: string
      remark:
        description: 备注
        type: string
    type: object
  request.DictTypeOperateParams:
    properties:
      dictId:
        description: 字典主键(新增时为空)
        example: "0"
        type: string
      dictName:
        description: 字典名称
        type: string
      dictType:
        description: 字典类型(唯一)
        type: string
      remark:
        description: 备注
        type: string
    type: object
  request.GetUserList:
    properties:
      deptId:
        example: "0"
        type: string
      keyword:
        description: 关键字
        type: string
      pageNum:
        description: 页码
        type: integer
      pageSize:
        description: 每页大小
        type: integer
      userName:
        type: string
    type: object
  request.InitDB:
    properties:
      adminPassword:
        type: string
      dbName:
        description: 数据库名
        type: string
      dbPath:
        description: sqlite数据库文件路径
        type: string
      dbType:
        description: 数据库类型
        type: string
      host:
        description: 服务器地址
        type: string
      initKey:
        description: 系统初始化密钥（配置 init-key 非空时必须匹配）
        type: string
      password:
        description: 数据库密码
        type: string
      port:
        description: 数据库连接端口
        type: string
      redisAddr:
        description: Redis 配置（向导第 2 步采集，随 initdb 一次性提交）
        type: string
      redisDB:
        type: integer
      redisPassword:
        type: string
      template:
        description: postgresql指定template
        type: string
      userName:
        description: 数据库用户名
        type: string
    required:
    - adminPassword
    - dbName
    type: object
  request.Login:
    properties:
      captcha:
        description: 验证码答案(go-captcha 为 JSON 字符串)
        type: string
      captchaId:
        description: 验证码会话 ID
        type: string
      password:
        description: 密码(明文,传输层由网关/加密中间件保护)
        type: string
      username:
        description: 用户名
        type: string
    type: object
  request.MenuOperateParams:
    properties:
      component:
        description: 组件路径
        type: string
      icon:
        description: 菜单图标
        type: string
      isCache:
        description: 是否缓存 0缓存1不缓存
        type: string
      isFrame:
        description: 是否外链 0是1否2iframe
        type: string
      menuId:
        description: 菜单ID(新增时为空)
        type: integer
      menuName:
        description: 菜单名称
        type: string
      menuType:
        description: 菜单类型 M目录C菜单F按钮
        type: string
      orderNum:
        description: 显示顺序
        type: integer
      parentId:
        description: 父菜单ID(0=顶级)
        type: integer
      path:
        description: 路由地址
        type: string
      perms:
        description: 权限标识
        type: string
      queryParam:
        description: 路由参数
        type: string
      remark:
        description: 备注
        type: string
      status:
        description: 菜单状态 0正常1停用
        type: string
      visible:
        description: 显示状态 0显示1隐藏
        type: string
    type: object
  request.NoticeOperateParams:
    properties:
      noticeContent:
        description: 公告内容
        type: string
      noticeId:
        description: 公告ID(新增时为空)
        example: "0"
        type: string
      noticeTitle:
        description: 公告标题
        type: string
      noticeType:
        description: 公告类型('1'通知 '2'公告)
        type: string
      status:
        description: 公告状态('0'正常 '1'停用)
        type: string
      targetDeptIds:
        description: 指定部门含子部门(targetType=depts)
        items:
          type: integer
        type: array
      targetType:
        description: 投递范围:all/users/depts(公告强制 all)
        type: string
      targetUserIds:
        description: 指定用户(targetType=users)
        items:
          type: integer
        type: array
    type: object
  request.NoticeReadParams:
    properties:
      noticeIds:
        description: 通知ID列表(空=当前用户全部已读)
        items:
          type: integer
        type: array
    type: object
  request.PingRedis:
    properties:
      addr:
        type: string
      db:
        type: integer
      password:
        type: string
    type: object
  request.PostOperateParams:
    properties:
      deptId:
        description: 部门ID(必填,归属部门)
        example: "0"
        type: string
      postCategory:
        description: 岗位类别编码
        type: string
      postCode:
        description: 岗位编码(唯一)
        type: string
      postId:
        description: 岗位ID(新增时为空)
        example: "0"
        type: string
      postName:
        description: 岗位名称
        type: string
      postSort:
        description: 显示顺序
        type: integer
      remark:
        description: 备注
        type: string
      status:
        description: 岗位状态('0'正常/'1'停用)
        type: string
    type: object
  request.PublicSetting:
    properties:
      captchaEnabled:
        description: 验证码(sys_security_config.Captcha*,登录页验证码渲染用)
        type: boolean
      captchaOpen:
        type: integer
      captchaType:
        type: string
      dingtalkEnabled:
        type: boolean
      faviconUrl:
        type: string
      giteeEnabled:
        type: boolean
      githubEnabled:
        type: boolean
      imgHeight:
        type: integer
      imgWidth:
        type: integer
      keyLong:
        type: integer
      logoUrl:
        type: string
      registerEnabled:
        description: 认证公开字段（仅公开开关，不暴露密钥）
        type: boolean
      resetPwdEnabled:
        type: boolean
      systemDescription:
        type: string
      systemName:
        description: 系统信息(sys_general_config)
        type: string
      wechatEnabled:
        type: boolean
      wecomEnabled:
        type: boolean
    type: object
  request.Register:
    properties:
      deptId:
        description: 主部门 ID
        example: "0"
        type: string
      email:
        type: string
      nickName:
        type: string
      password:
        type: string
      phonenumber:
        type: string
      roleId:
        description: 主角色 ID
        example: "0"
        type: string
      roleIds:
        description: 多角色
        items:
          type: integer
        type: array
      username:
        type: string
    type: object
  request.ResetUserPwdParams:
    properties:
      password:
        description: 新密码(明文)
        type: string
      userId:
        description: 用户ID
        type: integer
    type: object
  request.RoleOperateParams:
    properties:
      menuCheckStrictly:
        description: 菜单树选择项是否关联显示
        type: boolean
      menuIds:
        description: 分配菜单ID(全量;叶子+半选父级)
        items:
          type: integer
        type: array
      remark:
        description: 备注
        type: string
      roleId:
        description: 角色ID(新增时为空)
        type: integer
      roleKey:
        description: 角色权限字符(唯一)
        type: string
      roleName:
        description: 角色名称
        type: string
      roleSort:
        description: 显示顺序
        type: integer
      status:
        description: 角色状态('0'正常/'1'停用)
        type: string
    type: object
  request.SettingConfig:
    properties:
      auth:
        $ref: '#/definitions/system.SysAuthConfig'
      disk:
        $ref: '#/definitions/system.SysDiskConfig'
      general:
        $ref: '#/definitions/system.SysGeneralConfig'
      ldap:
        $ref: '#/definitions/system.SysLdapConfig'
      notify:
        $ref: '#/definitions/system.SysNotifyConfig'
      security:
        $ref: '#/definitions/system.SysSecurityConfig'
    type: object
  request.TestEmailReq:
    properties:
      emailFromAddr:
        type: string
      emailFromName:
        type: string
      emailHost:
        type: string
      emailPassword:
        type: string
      emailPort:
        type: integer
      emailSSLMode:
        type: string
      emailUsername:
        type: string
      testTo:
        type: string
    type: object
  request.ToggleTimedTask:
    properties:
      ID:
        type: integer
      enabled:
        type: boolean
    required:
    - ID
    type: object
  request.TriggerTimedTask:
    properties:
      ID:
        type: integer
    required:
    - ID
    type: object
  request.UserOperateParams:
    properties:
      deptId:
        description: 主部门ID
        type: integer
      email:
        description: 邮箱
        type: string
      nickName:
        description: 昵称
        type: string
      password:
        description: 密码(create 必填;update 空=不改)
        type: string
      phonenumber:
        description: 手机号
        type: string
      postIds:
        description: 岗位ID列表(全量替换)
        items:
          type: integer
        type: array
      remark:
        description: 备注
        type: string
      roleIds:
        description: 角色ID列表(全量替换)
        items:
          type: integer
        type: array
      sex:
        description: 性别 0男1女2未知
        type: string
      status:
        description: 状态
        type: string
      userId:
        description: 用户ID(新增时为空)
        type: integer
      userName:
        description: 用户名(create 必填,唯一)
        type: string
    type: object
  response.LoginResponse:
    properties:
      expiresAt:
        description: access token 过期毫秒时间戳
        type: integer
      needChangePassword:
        description: 密码过期需强制修改
        type: boolean
    type: object
  response.PageResult:
    properties:
      pageNum:
        type: integer
      pageSize:
        type: integer
      rows: {}
      total:
        type: integer
    type: object
  response.Response:
    properties:
      code:
        type: string
      data: {}
      msg:
        type: string
    type: object
  response.SysTimedTaskRow:
    properties:
      createTime:
        description: |-
          字段名用 gorm 约定的 CreatedAt/UpdatedAt, 由 gorm 自动维护(写入填值、更新刷值);
          column 锁定 create_time/update_time 列名, 沿用历史列不漂移成 created_at/updated_at;
          json 仍叫 createTime/updateTime 对齐前端 CommonRecord。
        type: string
      description:
        type: string
      enabled:
        type: boolean
      executorType:
        type: string
      httpAllowPrivate:
        type: boolean
      httpBody:
        type: string
      httpHeader:
        type: object
      httpMethod:
        type: string
      httpUrl:
        type: string
      id:
        description: 主键(过渡保留,未改造系统表用)
        example: "0"
        type: string
      methodName:
        type: string
      name:
        type: string
      nextRunAt:
        description: 已调度(enabled)任务的下次执行时间; 未调度为 null
        type: string
      params:
        type: object
      spec:
        type: string
      updateTime:
        type: string
      withSeconds:
        type: boolean
    type: object
  response.SysUserResponse:
    properties:
      user:
        $ref: '#/definitions/system.SysUser'
    type: object
  system.CaptchaResult:
    properties:
      angle:
        description: rotate 缩略图初始角度
        type: integer
      captchaEnabled:
        description: 当前是否要求验证码（触发策略决定）
        type: boolean
      captchaId:
        description: 验证码会话 ID
        type: string
      masterImage:
        description: 主图 base64（含 data:image/*;base64, 前缀）
        type: string
      thumbHeight:
        description: slide 拼图块高度
        type: integer
      thumbImage:
        description: 缩略图 base64（click/rotate）
        type: string
      thumbSize:
        description: rotate 缩略图尺寸
        type: integer
      thumbWidth:
        description: slide 拼图块宽度
        type: integer
      thumbX:
        description: slide 拼图块初始 X
        type: integer
      thumbY:
        description: slide 拼图块初始 Y
        type: integer
      tileImage:
        description: 拼图块 base64（slide）
        type: string
      type:
        description: image | click | slide | rotate
        type: string
    type: object
  system.DeptTreeNode:
    properties:
      children:
        description: 子部门
        items:
          $ref: '#/definitions/system.DeptTreeNode'
        type: array
      id:
        description: 部门ID(字符串,雪花 id 统一 string)
        example: "0"
        type: string
      label:
        description: 部门名称
        type: string
      parentId:
        description: 父部门ID(字符串)
        example: "0"
        type: string
      weight:
        description: 显示顺序(对应 SysDepartment.OrderNum)
        type: integer
    type: object
  system.MenuTreeSelectNode:
    properties:
      children:
        description: 子节点(内存组装;叶子节点省略)
        items:
          $ref: '#/definitions/system.MenuTreeSelectNode'
        type: array
      icon:
        description: 菜单图标
        type: string
      id:
        description: 菜单ID(对齐前端 IdType)
        example: "0"
        type: string
      label:
        description: 菜单名称(NTree label-field;可能为 i18n key 如 route.xxx)
        type: string
      menuType:
        description: 菜单类型 M目录C菜单F按钮(前端渲染区分)
        type: string
      status:
        description: 菜单状态 0正常1停用(前端禁用标红)
        type: string
      visible:
        description: 显示状态 0显示1隐藏(前端隐藏标灰)
        type: string
    type: object
  system.NoticeRecordVO:
    properties:
      createTime:
        type: string
      noticeContent:
        type: string
      noticeId:
        example: "0"
        type: string
      noticeTitle:
        type: string
      noticeType:
        type: string
      readAt:
        type: string
    type: object
  system.RoleMenuTreeSelect:
    properties:
      checkedKeys:
        description: 角色已分配菜单的叶子 ID
        items:
          type: integer
        type: array
      menus:
        description: 全部菜单树(精简 VO,后端组装)
        items:
          $ref: '#/definitions/system.MenuTreeSelectNode'
        type: array
    type: object
  system.SysAuthConfig:
    properties:
      createTime:
        description: |-
          字段名用 gorm 约定的 CreatedAt/UpdatedAt, 由 gorm 自动维护(写入填值、更新刷值);
          column 锁定 create_time/update_time 列名, 沿用历史列不漂移成 created_at/updated_at;
          json 仍叫 createTime/updateTime 对齐前端 CommonRecord。
        type: string
      dingtalkCallbackUrl:
        type: string
      dingtalkClientId:
        type: string
      dingtalkClientSecret:
        type: string
      dingtalkEnabled:
        description: 钉钉
        type: boolean
      giteeCallbackUrl:
        type: string
      giteeClientId:
        type: string
      giteeClientSecret:
        type: string
      giteeEnabled:
        description: Gitee
        type: boolean
      githubCallbackUrl:
        type: string
      githubClientId:
        type: string
      githubClientSecret:
        type: string
      githubEnabled:
        description: GitHub
        type: boolean
      id:
        description: 主键(过渡保留,未改造系统表用)
        example: "0"
        type: string
      registerEnabled:
        description: 账号功能
        type: boolean
      resetPwdEnabled:
        type: boolean
      updateTime:
        type: string
      wechatCallbackUrl:
        type: string
      wechatClientId:
        type: string
      wechatClientSecret:
        type: string
      wechatEnabled:
        description: 微信开放平台
        type: boolean
      wecomAgentId:
        type: integer
      wecomCallbackUrl:
        type: string
      wecomClientId:
        type: string
      wecomClientSecret:
        type: string
      wecomCorpId:
        type: string
      wecomDomainFileContent:
        type: string
      wecomDomainFileName:
        type: string
      wecomEnabled:
        description: 企业微信
        type: boolean
    type: object
  system.SysDepartment:
    properties:
      ancestors:
        description: 祖级链
        type: string
      children:
        description: 子部门(内存组装,不建列)
        items:
          $ref: '#/definitions/system.SysDepartment'
        type: array
      createBy:
        example: "0"
        type: string
      createTime:
        description: |-
          字段名用 gorm 约定的 CreatedAt/UpdatedAt, 由 gorm 自动维护(写入填值、更新刷值);
          column 锁定 create_time/update_time 列名, 沿用历史列不漂移成 created_at/updated_at;
          json 仍叫 createTime/updateTime 对齐前端 CommonRecord。
        type: string
      deptCategory:
        description: 部门类别编码
        type: string
      deptId:
        description: 部门ID(列名 dept_id)
        example: "0"
        type: string
      deptName:
        description: 部门名称
        type: string
      email:
        description: 邮箱(部门独立)
        type: string
      leader:
        description: 负责人(用户ID,对齐前端 number)
        type: integer
      namePath:
        description: 公司/部门全路径名(内存组装,不建列)
        type: string
      orderNum:
        description: 显示顺序
        type: integer
      parentId:
        description: 父部门ID(0为顶级)
        example: "0"
        type: string
      phone:
        description: 联系电话(部门独立)
        type: string
      status:
        description: 部门状态(对齐前端 '0'/'1')
        type: string
      updateBy:
        example: "0"
        type: string
      updateTime:
        type: string
    type: object
  system.SysDictData:
    properties:
      createBy:
        example: "0"
        type: string
      createTime:
        description: |-
          字段名用 gorm 约定的 CreatedAt/UpdatedAt, 由 gorm 自动维护(写入填值、更新刷值);
          column 锁定 create_time/update_time 列名, 沿用历史列不漂移成 created_at/updated_at;
          json 仍叫 createTime/updateTime 对齐前端 CommonRecord。
        type: string
      cssClass:
        description: 样式属性(其他样式扩展)
        type: string
      dictCode:
        description: 字典编码
        example: "0"
        type: string
      dictLabel:
        description: 字典标签
        type: string
      dictSort:
        description: 字典排序
        type: integer
      dictType:
        description: 字典类型(关联 sys_dict_type.dict_type)
        type: string
      dictValue:
        description: 字典键值
        type: string
      i18nKey:
        description: 多语言标识
        type: string
      isDefault:
        description: 是否默认(对齐前端 YesOrNoStatus)
        type: string
      isI18n:
        description: 是否多语言(可空)
        type: boolean
      listClass:
        description: 表格回显样式(NaiveUI ThemeColor)
        type: string
      remark:
        description: 备注
        type: string
      updateBy:
        example: "0"
        type: string
      updateTime:
        type: string
    type: object
  system.SysDictType:
    properties:
      createBy:
        example: "0"
        type: string
      createTime:
        description: |-
          字段名用 gorm 约定的 CreatedAt/UpdatedAt, 由 gorm 自动维护(写入填值、更新刷值);
          column 锁定 create_time/update_time 列名, 沿用历史列不漂移成 created_at/updated_at;
          json 仍叫 createTime/updateTime 对齐前端 CommonRecord。
        type: string
      dictId:
        description: 字典主键
        example: "0"
        type: string
      dictName:
        description: 字典名称
        type: string
      dictType:
        description: 字典类型(唯一)
        type: string
      remark:
        description: 备注
        type: string
      updateBy:
        example: "0"
        type: string
      updateTime:
        type: string
    type: object
  system.SysDiskConfig:
    properties:
      allowedExtensions:
        type: string
      blockedExtensions:
        type: string
