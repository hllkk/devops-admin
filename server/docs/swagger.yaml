definitions:
  request.DBConnTest:
    properties:
      dbName:
        type: string
      dbPath:
        type: string
      dbType:
        type: string
      host:
        type: string
      password:
        type: string
      port:
        type: string
      template:
        type: string
      userName:
        type: string
    type: object
  request.InitDB:
    properties:
      adminPassword:
        type: string
      dbName:
        description: 数据库名
        type: string
      dbPath:
        description: sqlite数据库文件路径
        type: string
      dbType:
        description: 数据库类型
        type: string
      host:
        description: 服务器地址
        type: string
      initKey:
        description: 系统初始化密钥（配置 init-key 非空时必须匹配）
        type: string
      password:
        description: 数据库密码
        type: string
      port:
        description: 数据库连接端口
        type: string
      redisAddr:
        description: Redis 配置（向导第 2 步采集，随 initdb 一次性提交）
        type: string
      redisDB:
        type: integer
      redisPassword:
        type: string
      template:
        description: postgresql指定template
        type: string
      userName:
        description: 数据库用户名
        type: string
    required:
    - adminPassword
    - dbName
    type: object
  request.Login:
    properties:
      captcha:
        description: 验证码
        type: string
      captchaId:
        description: 验证码ID
        type: string
      password:
        description: 密码
        type: string
      username:
        description: 用户名
        type: string
    type: object
  request.PingRedis:
    properties:
      addr:
        type: string
      db:
        type: integer
      password:
        type: string
    type: object
  request.TestConnectRequest:
    properties:
      connectType:
        description: '"db" 或 "redis"'
        type: string
      dbName:
        type: string
      dbPath:
        type: string
      dbType:
        description: DB 字段（connectType="db" 时使用）
        type: string
      host:
        type: string
      password:
        type: string
      port:
        type: string
      redisAddr:
        description: Redis 字段（connectType="redis" 时使用）
        type: string
      redisDB:
        type: integer
      redisPassword:
        type: string
      template:
        type: string
      userName:
        type: string
    required:
    - connectType
    type: object
  response.Response:
    properties:
      code:
        type: string
      data: {}
      msg:
        type: string
    type: object
info:
  contact: {}
  description: 使用gin+vue进行极速开发的全栈开发基础平台
  title: devops-admin Swagger API接口文档
  version: v0.1.0
paths:
  /auth/code:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: captchaEnabled, uuid, img
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: object
                msg:
                  type: string
              type: object
      summary: 生成验证码
      tags:
      - Base
  /auth/getUserInfo:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 返回 user, roles, permissions
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: object
                msg:
                  type: string
              type: object
      security:
      - ApiKeyAuth: []
      summary: 获取用户信息
      tags:
      - Base
  /auth/login:
    post:
      parameters:
      - description: 用户名, 密码
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.Login'
      produces:
      - application/json
      responses:
        "200":
          description: access/refresh 写入 httpOnly cookie，返回 expiresAt(毫秒)
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: object
                msg:
                  type: string
              type: object
      summary: 用户登录
      tags:
      - Base
  /auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: 清除登录 cookie，当前 token 入黑名单
          schema:
            $ref: '#/definitions/response.Response'
      summary: 退出登录
      tags:
      - Base
  /auth/refreshToken:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: 用 refresh-token cookie 换发新 access/refresh，返回 expiresAt(毫秒)；失败
            code=8888
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: object
                msg:
                  type: string
              type: object
      summary: 刷新令牌
      tags:
      - Base
  /init/checkdb:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: 检查数据库是否需要初始化结果
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties: true
                  type: object
                msg:
                  type: string
              type: object
      summary: 检查数据库是否需要初始化
      tags:
      - SysInit
  /init/db/ping:
    post:
      parameters:
      - description: 数据库连接参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.DBConnTest'
      produces:
      - application/json
      responses:
        "200":
          description: 连接成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: string
              type: object
      summary: 测试数据库连接
      tags:
      - SysInit
  /init/initdb:
    post:
      parameters:
      - description: 初始化数据库参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.InitDB'
      produces:
      - application/json
      responses:
        "200":
          description: 初始化用户数据库
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: string
              type: object
      summary: 初始化用户数据库
      tags:
      - SysInit
  /init/redis/ping:
    post:
      parameters:
      - description: Redis 连接参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.PingRedis'
      produces:
      - application/json
      responses:
        "200":
          description: 连接成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: string
              type: object
      summary: 测试 Redis 连接
      tags:
      - SysInit
  /init/testConnect:
    post:
      parameters:
      - description: 连接测试参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.TestConnectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 连接成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: string
              type: object
      summary: 测试数据库或 Redis 连接
      tags:
      - SysInit
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: x-token
    type: apiKey
swagger: "2.0"
tags:
- name: Base
- description: 用户
  name: SysUser
- description: 初始化
  name: SysInit
