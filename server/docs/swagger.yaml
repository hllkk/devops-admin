        description: 手机号(对齐前端 phonenumber)
        type: string
      posts:
        description: 多岗位
        items:
          $ref: '#/definitions/system.SysPost'
        type: array
      remark:
        description: 备注
        type: string
      roles:
        description: 多角色(join 列对齐 sys_user_id/sys_role_id)
        items:
          $ref: '#/definitions/system.SysRole'
        type: array
      sex:
        description: 性别
        type: string
      status:
        description: 帐号状态(对齐前端 '0'/'1')
        type: string
      superAdmin:
        description: 是否超管(内存组装,任一关联角色 SuperAdmin;前端列表超管保护依赖)
        type: boolean
      updateBy:
        example: "0"
        type: string
      updateTime:
        type: string
      userId:
        description: 用户ID(DB列复用id,雪花int64)
        example: "0"
        type: string
      userName:
        description: 用户登录名
        type: string
      userType:
        description: 用户类型
        type: string
      uuid:
        description: 用户UUID(登录链路)
        type: string
    type: object
  system.UserInfo:
    properties:
      postIds:
        description: 用户岗位 ID 列表(字符串)
        items:
          type: string
        type: array
      roleIds:
        description: 用户角色 ID 列表(字符串)
        items:
          type: string
        type: array
      roles:
        description: 用户角色列表(含 roleName/roleId 供下拉)
        items:
          $ref: '#/definitions/system.SysRole'
        type: array
    type: object
  system.UserRoute:
    properties:
      home:
        type: string
      routes:
        items:
          $ref: '#/definitions/system.MenuRoute'
        type: array
    type: object
  task.TaskMeta:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
info:
  contact: {}
  description: 使用devops-admin进行开发基础平台
  title: Devops-Admin Swagger API接口文档
  version: v0.2.0
paths:
  /auth/binding/{source}:
    get:
      parameters:
      - description: 来源:wechat_open/gitee/github
        in: path
        name: source
        required: true
        type: string
      - description: 回调域名(默认取 Host)
        in: query
        name: domain
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 授权URL字符串
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: string
                msg:
                  type: string
              type: object
      summary: 获取第三方授权URL
      tags:
      - Social
  /auth/qrCodeStatus:
    get:
      parameters:
      - description: QrCodeView 返回的 sceneId
        in: query
        name: sceneId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{status,expiresAt?,errMsg?}'
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: object
                msg:
                  type: string
              type: object
      summary: 企业微信扫码登录-轮询状态
      tags:
      - Wecom
  /auth/social/callback:
    post:
      parameters:
      - description: socialCode/socialState/source/grantType
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.SocialLoginForm'
      produces:
      - application/json
      responses:
        "200":
          description: 绑定成功返回提示;登录成功签发JWT(httpOnly cookie)并返回 LoginResponse
          schema:
            $ref: '#/definitions/response.Response'
      summary: 社交登录/绑定回调(交换code+处理绑定或登录)
      tags:
      - Social
  /auth/unlock/{id}:
    delete:
      parameters:
      - description: 关联记录ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 解绑成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                msg:
                  type: string
              type: object
      summary: 解绑指定第三方账号(至少保留一种登录方式)
      tags:
      - Social
  /auth/wecomLogin:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: '{sceneId,oauthUrl,countdown}'
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: object
                msg:
                  type: string
              type: object
      summary: 企业微信扫码登录-获取二维码
      tags:
      - Wecom
  /auth/wecomWebviewLogin:
    get:
      parameters:
      - description: 登录后回跳路径(同源相对)
        in: query
        name: redirect
        type: string
      produces:
      - text/html
      responses: {}
      summary: 企业微信客户端免登-跳转授权
      tags:
      - Wecom
  /base/captcha:
    get:
      parameters:
      - description: 用户名(触发阈值判断)
        in: query
        name: username
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/system.CaptchaResult'
                msg:
                  type: string
              type: object
      summary: 生成验证码(go-captcha 行为验证)
      tags:
      - Base
  /base/login:
    post:
      parameters:
      - description: 用户名, 密码, 验证码
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.Login'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.LoginResponse'
                msg:
                  type: string
              type: object
      summary: 用户登录
      tags:
      - Base
  /gateway/ai-key:
    post:
      consumes:
      - application/json
      parameters:
      - description: 密钥信息
        in: body
        name: data
        required: true
