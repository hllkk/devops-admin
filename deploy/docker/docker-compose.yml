name: ops-prod

services:
  # ================================
  # Nginx 反向代理 + 前端静态资源
  # ================================
  nginx:
    image: nginx:1.30-alpine
    container_name: ops-nginx
    ports:
      - "80:80"
      # - "443:443"  # SSL 启用后取消注释
    volumes:
      - ./conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../frontend/dist:/usr/share/nginx/html:ro  # 前端构建产物
    depends_on:
      backend:
        condition: service_healthy
      onlyoffice:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ops-net

  # ================================
  # Go 后端
  # ================================
  backend:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
    container_name: ops-backend
    environment:
      - TZ=Asia/Shanghai
      - DOCKER_ENV=true
      - GIN_MODE=release
      - INIT_ADMIN_PASSWORD=${INIT_ADMIN_PASSWORD:-Admin@2026}
      # JWT 签名密钥（必须设置，生成: openssl rand -hex 32）；由 initialize/other.go 读取
      - JWT_SIGNING_KEY=${JWT_SIGNING_KEY:?必须设置JWT签名密钥}
      # Cookie Secure 标志（HTTPS 环境必须 true）；由 initialize/other.go 读取覆盖配置
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # 可信反代 CIDR/IP（逗号分隔），多层反代下正确解析真实 ClientIP；由 initialize/other.go 读取
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      # MySQL/PostgreSQL/Redis 密码由 initialize/other.go 读取覆盖 config.yaml，无需手动同步两处
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-devops_admin_2026}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?必须设置PostgreSQL密码}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-devops_redis_2026}
      # 数据库敏感字段加密密钥（独立于 JWT 密钥，避免不同环境密钥交叉导致解密失败）
      # 未设置时回退到 JWT_SIGNING_KEY，但 JWT 密钥变更会使已加密的配置无法解密
      # 生成命令: openssl rand -hex 32
      - SECRET_ENCRYPT_KEY=${SECRET_ENCRYPT_KEY:-}
      # 企业微信凭证现由「系统设置 → 认证 → 企业微信」页面配置（数据库存储），无需环境变量
    volumes:
      - /home/docker/app-storage:/app/storage
      - /home/docker/app-logs:/app/log
      - ./conf/config.yaml:/app/conf/config.yaml:ro  # 覆盖配置
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ops-net

  # ================================
  # PostgreSQL 17 (生产环境)
  # ================================
  postgres:
    image: postgres:17-alpine
    container_name: ops-postgres
    environment:
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须设置PostgreSQL密码}
      POSTGRES_DB: devops-admin
      TZ: Asia/Shanghai
    volumes:
      - /home/docker/postgres:/var/lib/postgresql/data
    ports:
      - "15433:5432"
    command: ["postgres", "-c", "timezone=Asia/Shanghai"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops -d devops-admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ops-net

  # ================================
  # litellm AI 网关数据面 (生产环境)
  # 转发面对齐 AIHelms：客户端(含本地 go run 的 backend)直连此服务虚拟 key 转发
  # Go backend 仅作管理面，经 litellm Admin API 管理 credentials/models/keys
  # DATABASE_URL 指向同库 ops-postgres(litellm 表)与 gateway schema 隔离
  # ================================
  litellm:
    image: ghcr.io/berriai/litellm:v1.91.0
    container_name: ops-litellm
    environment:
      DATABASE_URL: postgresql://devops:${POSTGRES_PASSWORD:?必须设置PostgreSQL密码}@postgres:5432/devops-admin?schema=public
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-prod-litellm-master-2026}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-prod-litellm-salt-2026}
      STORE_MODEL_IN_DB: "true"
      TZ: Asia/Shanghai
    volumes:
      - ./litellm/litellm.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    command: ["--config", "/app/config.yaml"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/liveliness"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ops-net

  # ================================
  # Redis 8
  # ================================
  redis:
    image: redis:8-alpine
    container_name: ops-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-devops_redis_2026} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - /home/docker/redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devops_redis_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ops-net

  # ================================
  # OnlyOffice 文档服务
  # ================================
  onlyoffice:
    image: moqisoft/documentserver:9.3.10
    container_name: ops-onlyoffice
    environment:
      - JWT_ENABLED=true
      - TZ=Asia/Shanghai
      - ALLOW_PRIVATE_IP_ADDRESS=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:?必须设置OnlyOffice密钥}
    volumes:
      - /home/docker/onlyoffice-data:/var/lib/onlyoffice
      - /home/docker/onlyoffice-logs:/var/log/onlyoffice
    ports:
      - "8443:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - ops-net

  # ================================
  # RustFS 对象存储
  # ================================
  rustfs:
    image: rustfs/rustfs:latest
    container_name: ops-rustfs
    user: root  # 以root用户运行，避免权限问题
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web 管理控制台
    environment:
      RUSTFS_ROOT_USER: ${RUSTFS_ROOT_USER:-devops-admin}
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_ROOT_PASSWORD:-devops_rustfs_2026}
      RUSTFS_BROWSER: "on"
    volumes:
      - /home/docker/rustfs:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - ops-net
# ================================
# 网络
# ================================
networks:
  ops-net:
    driver: bridge