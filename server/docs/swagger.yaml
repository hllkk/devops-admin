definitions:
  request.DBConnTest:
    properties:
      dbName:
        type: string
      dbPath:
        type: string
      dbType:
        type: string
      host:
        type: string
      password:
        type: string
      port:
        type: string
      template:
        type: string
      userName:
        type: string
    type: object
  request.InitDB:
    properties:
      adminPassword:
        type: string
      dbName:
        description: 数据库名
        type: string
      dbPath:
        description: sqlite数据库文件路径
        type: string
      dbType:
        description: 数据库类型
        type: string
      host:
        description: 服务器地址
        type: string
      initKey:
        description: 系统初始化密钥（配置 init-key 非空时必须匹配）
        type: string
      password:
        description: 数据库密码
        type: string
      port:
        description: 数据库连接端口
        type: string
      redisAddr:
        description: Redis 配置（向导第 2 步采集，随 initdb 一次性提交）
        type: string
      redisDB:
        type: integer
      redisPassword:
        type: string
      template:
        description: postgresql指定template
        type: string
      userName:
        description: 数据库用户名
        type: string
    required:
    - adminPassword
    - dbName
    type: object
  request.PingRedis:
    properties:
      addr:
        type: string
      db:
        type: integer
      password:
        type: string
    type: object
  response.Response:
    properties:
      code:
        type: string
      data: {}
      msg:
        type: string
    type: object
  system.CaptchaResult:
    properties:
      angle:
        description: rotate 缩略图初始角度
        type: integer
      captchaEnabled:
        description: 当前是否要求验证码（触发策略决定）
        type: boolean
      captchaId:
        description: 验证码会话 ID
        type: string
      masterImage:
        description: 主图 base64（含 data:image/*;base64, 前缀）
        type: string
      thumbHeight:
        description: slide 拼图块高度
        type: integer
      thumbImage:
        description: 缩略图 base64（click/rotate）
        type: string
      thumbSize:
        description: rotate 缩略图尺寸
        type: integer
      thumbWidth:
        description: slide 拼图块宽度
        type: integer
      thumbX:
        description: slide 拼图块初始 X
        type: integer
      thumbY:
        description: slide 拼图块初始 Y
        type: integer
      tileImage:
        description: 拼图块 base64（slide）
        type: string
      type:
        description: image | click | slide | rotate
        type: string
    type: object
info:
  contact: {}
  description: 使用devops-admin进行开发基础平台
  title: Devops-Admin Swagger API接口文档
  version: v0.2.0
paths:
  /auth/captcha:
    get:
      description: 按触发策略决定是否返回验证码：captchaEnabled=false 表示当前无需验证码；为 true 时返回 type/captchaId
        与对应图片。type=image 为传统图形验证码，click/slide/rotate 为 go-captcha 行为验证码。
      parameters:
      - description: 用户名(阈值模式下用于判断账号是否触发验证码)
        in: query
        name: username
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: captchaEnabled/type/captchaId/masterImage/tileImage/thumbImage
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/system.CaptchaResult'
                msg:
                  type: string
              type: object
      summary: 生成验证码
      tags:
      - Auth
  /init/checkdb:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: 检查数据库是否需要初始化结果
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties: true
                  type: object
                msg:
                  type: string
              type: object
      summary: 检查数据库是否需要初始化
      tags:
      - SysInit
  /init/conn-test:
    post:
      parameters:
      - description: 数据库连接参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.DBConnTest'
      produces:
      - application/json
      responses:
        "200":
          description: 连接成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: string
              type: object
      summary: 测试数据库连接
      tags:
      - SysInit
  /init/initdb:
    post:
      parameters:
      - description: 初始化数据库参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.InitDB'
      produces:
      - application/json
      responses:
        "200":
          description: 初始化用户数据库
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: string
              type: object
      summary: 初始化用户数据库
      tags:
      - SysInit
  /init/redis/ping:
    post:
      parameters:
      - description: Redis 连接参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/request.PingRedis'
      produces:
      - application/json
      responses:
        "200":
          description: 连接成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: string
              type: object
      summary: 测试 Redis 连接
      tags:
      - SysInit
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: x-token
    type: apiKey
swagger: "2.0"
tags:
- description: 基础接口
  name: Base
- description: 初始化数据库
  name: SysInit
- description: 用户
  name: SysUser
